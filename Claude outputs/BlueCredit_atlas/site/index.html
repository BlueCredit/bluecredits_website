    // --- IM3 WATER-CONTEXT ANALYSIS (runs live when a popup opens) ---
    const SVC = {
        huc8: 'https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/4',
        pws:  'https://services.arcgis.com/cJ9YHowT8TU7DUyn/arcgis/rest/services/Water_System_Boundaries/FeatureServer/0',
        flow: 'https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/6',
        wbody:'https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/12',
        nwi:  'https://fwspublicservices.wim.usgs.gov/wetlandsmapservice/rest/services/Wetlands/MapServer/0'
    };
    const RIVER_RADIUS_MI = 2, WETLAND_RADIUS_MI = 1;
    const FLOW_FTYPE = { 460: 'Stream/River', 558: 'Artificial path', 336: 'Canal/Ditch', 334: 'Connector', 566: 'Coastline' };
    const WB_FTYPE   = { 390: 'Lake/Pond', 436: 'Reservoir', 466: 'Swamp/Marsh', 493: 'Estuary', 361: 'Playa' };
    const im3Cache = {};

    function esriQuery(url, geom, limit) {
        return new Promise(resolve => {
            let q = L.esri.query({ url }).intersects(geom).precision(6);
            if (limit) q = q.limit(limit);
            q.run((err, fc) => resolve(err ? { error: err, features: [] } : (fc || { features: [] })));
        });
    }
    // Field lookup that tolerates UPPER/lower case and joined-table prefixes (e.g. "Wetlands.ATTRIBUTE")
    function fld(props, name) {
        if (!props) return undefined;
        const want = name.toLowerCase();
        const k = Object.keys(props).find(k => { const b = k.toLowerCase(); return b === want || b.endsWith('.' + want); });
        return k ? props[k] : undefined;
    }
    function distMi(pt, geom) {
        let best = Infinity;
        turf.flattenEach(turf.feature(geom), g => {
            const t = g.geometry.type;
            if (t === 'Polygon') {
                if (turf.booleanPointInPolygon(pt, g)) { best = 0; return; }
                turf.flattenEach(turf.polygonToLine(g), l => { best = Math.min(best, turf.pointToLineDistance(pt, l, { units: 'miles' })); });
            } else if (t === 'LineString') {
                best = Math.min(best, turf.pointToLineDistance(pt, g, { units: 'miles' }));
            } else if (t === 'Point') {
                best = Math.min(best, turf.distance(pt, g, { units: 'miles' }));
            }
        });
        return best;
    }
    const fmtMi = d => d === 0 ? '<span style="color:#b91c1c">on site</span>' : (d < 0.1 ? `${Math.round(d*5280).toLocaleString()} ft` : `${d.toFixed(2)} mi`);

    function im3WaterBox(key, full) {
        const row = (id, label) => `<div class="stat-row"><span>${label}</span><strong id="w-${id}-${key}" class="loading-pulse" style="text-align:right;max-width:60%">Looking up…</strong></div>`;
        return `
            <div class="analysis-box">
                <div class="analysis-title">Water Context</div>
                ${row('huc', 'Watershed (HUC-8):')}
                ${row('pws', 'Water utility:')}
                ${full ? `
                ${row('wet', 'Nearest wetland:')}
                ${row('riv', 'Nearest named river/stream:')}
                ${row('str', 'Nearest stream (any):')}
                ${row('lak', 'Nearest lake/reservoir:')}
                <div style="font-size:10px;color:#94a3b8;margin-top:4px;">Distances from facility centroid. Search radius ${RIVER_RADIUS_MI} mi (water), ${WETLAND_RADIUS_MI} mi (wetlands).</div>` : ''}
            </div>`;
    }
    function im3Fill(key, part, html) {
        const el = document.getElementById(`w-${part}-${key}`);
        if (el) { el.innerHTML = html; el.classList.remove('loading-pulse'); }
    }

    // Returns a Promise that resolves once every requested part has a result (used by basin reports)
    async function im3Analyze(key, lat, lng, full) {
        const cache = im3Cache[key] || (im3Cache[key] = {});
        const parts = full ? ['huc','pws','wet','riv','str','lak'] : ['huc','pws'];
        if (parts.every(k => cache[k])) { parts.forEach(k => im3Fill(key, k, cache[k])); return cache; }
        let resolveAll; const all = new Promise(r => resolveAll = r);
        const done = (k, html) => { cache[k] = html; im3Fill(key, k, html); if (parts.every(p => cache[p])) resolveAll(cache); };
        const pt = turf.point([lng, lat]);

        esriQuery(SVC.huc8, pt).then(fc => {
            if (fc.error) return done('huc', '<span style="color:#94a3b8">unavailable</span>');
            const f = fc.features[0];
            done('huc', f ? `${fld(f.properties,'name')} <span style="color:#64748b;font-weight:400">(${fld(f.properties,'huc8')})</span>` : 'Not found');
        });
        esriQuery(SVC.pws, pt).then(fc => {
            if (fc.error) return done('pws', '<span style="color:#94a3b8">unavailable</span>');
            if (!fc.features.length) return done('pws', '<span style="color:#b45309">Outside mapped service areas</span>');
            // Prefer community systems / largest population when areas overlap
            const f = fc.features.slice().sort((a, b) =>
                (parseInt(fld(b.properties,'Population_Served_Count')) || 0) - (parseInt(fld(a.properties,'Population_Served_Count')) || 0))[0];
            const nm = fld(f.properties,'NAME') || fld(f.properties,'PWS_Name') || 'Unnamed system';
            const more = fc.features.length > 1 ? ` <span style="color:#64748b;font-weight:400">+${fc.features.length-1} overlapping</span>` : '';
            done('pws', `${nm} <span style="color:#64748b;font-weight:400">(${fld(f.properties,'PWSID') || 'n/a'})</span>${more}`);
        });
        if (!full) return all;

        const wetBuf = turf.buffer(pt, WETLAND_RADIUS_MI, { units: 'miles' });
        esriQuery(SVC.nwi, wetBuf, 1000).then(fc => {
            if (fc.error) return done('wet', '<span style="color:#94a3b8">unavailable</span>');
            let best = null;
            fc.features.forEach(f => { const d = distMi(pt, f.geometry); if (!best || d < best.d) best = { d, f }; });
            if (!best) return done('wet', `None within ${WETLAND_RADIUS_MI} mi`);
            const pr = best.f.properties, ac = parseFloat(fld(pr,'ACRES'));
            done('wet', `${fmtMi(best.d)} — ${fld(pr,'WETLAND_TYPE') || 'Wetland'} <span style="color:#64748b;font-weight:400">(${fld(pr,'ATTRIBUTE') || ''}${isNaN(ac) ? '' : ', ' + ac.toFixed(1) + ' ac'})</span>`);
        });

        const buf = turf.buffer(pt, RIVER_RADIUS_MI, { units: 'miles' });
        esriQuery(SVC.flow, buf, 2000).then(fc => {
            if (fc.error) { done('riv', '<span style="color:#94a3b8">unavailable</span>'); return done('str', '<span style="color:#94a3b8">unavailable</span>'); }
            let named = null, any = null;
            fc.features.forEach(f => {
                const ft = parseInt(fld(f.properties,'FType'));
                if (!(ft in FLOW_FTYPE) || ft === 334) return;          // skip connectors, pipelines, conduits
                const d = distMi(pt, f.geometry), nm = fld(f.properties,'GNIS_NAME');
                if (!any || d < any.d) any = { d, nm, ft };
                if (nm && (!named || d < named.d)) named = { d, nm };
            });
            done('riv', named ? `${named.nm} — ${fmtMi(named.d)}` : `None within ${RIVER_RADIUS_MI} mi`);
            done('str', any ? `${fmtMi(any.d)} <span style="color:#64748b;font-weight:400">(${any.nm || 'unnamed'}, ${FLOW_FTYPE[any.ft]})</span>` : `None within ${RIVER_RADIUS_MI} mi`);
        });
        esriQuery(SVC.wbody, buf, 500).then(fc => {
            if (fc.error) return done('lak', '<span style="color:#94a3b8">unavailable</span>');
            let best = null;
            fc.features.forEach(f => {
                const ft = parseInt(fld(f.properties,'FType'));
                if (!(ft in WB_FTYPE)) return;
                const d = distMi(pt, f.geometry);
                if (!best || d < best.d) best = { d, nm: fld(f.properties,'GNIS_NAME'), ft };
            });
            done('lak', best ? `${best.nm || 'Unnamed ' + WB_FTYPE[best.ft].toLowerCase()} — ${fmtMi(best.d)}` : `None within ${RIVER_RADIUS_MI} mi`);
        });
        return all;
    }

    // --- SPATIAL RISK ANALYSIS ENGINE ---
    function performAnalysis(d, id) {
        const pt  = turf.point([d.lng, d.lat]);
        const buf = turf.buffer(pt, 2, { units: 'miles' });
        L.esri.query({ url: 'https://hydro.nationalmap.gov/arcgis/rest/services/wbd/MapServer/4' })
            .intersects(pt).run((err, fc) => {
                const el = document.getElementById(`ws-${id}`);
                if (el) { el.innerText = fc?.features[0]?.properties?.name || "Unknown Basin"; el.classList.remove('loading-pulse'); }
            });
        L.esri.query({ url: 'https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/6' })
            .intersects(buf).run((err, fc) => {
                const ri = document.getElementById(`ri-${id}`);
                let names = new Set();
                fc?.features?.forEach(f => { const n = f.properties.gnis_name || f.properties.GNIS_NAME; if (n) names.add(n); });
                if (ri) {
                    if (names.size === 0) ri.innerHTML = '<li>No major rivers within 2mi</li>';
                    else { ri.innerHTML = ''; names.forEach(n => ri.innerHTML += `<li class="risk-item">⚠️ River: ${n}</li>`); }
                }
            });
    }

    // --- LAYER PANEL (grouped) ---
    const SW = {   // legend swatches, drawn to match each layer's symbology

    // ── DROUGHT: U.S. Drought Monitor (NDMC / USDA / NOAA) ──

    const USDM = {

    const usdmDate = t => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });

    // ── STREAMFLOW vs. NORMAL: NOAA National Water Model analysis (NWC "ana_anomaly" service). Stream reaches are

    const NWM = {
        url: 'https://maps.water.noaa.gov/server/rest/services/nwm/ana_anomaly/MapServer',

    streamflowLayer.bindPopup((err, fc) => {

        const g = (...k) => { for (const x of k) if (a[x] != null && a[x] !== '' && a[x] !== 'Null') return a[x]; return null; };   // identify returns field aliases

            <div class="stat-row"><span>Normal range (25th–75th):</span><strong>${nwmFmt(parseFloat(g('25th Percentile Streamflow (cfs)', 'prcntle_25')))} – ${nwmFmt(parseFloat(g('75th Percentile Streamflow (cfs)', 'prcntle_75')))}</strong></div>
            <div style="font-size:10.5px;color:#64748b;margin-top:6px">NOAA National Water Model estimate${vt ? ' for ' + gcEsc(vt) + ' (UTC)' : ''}, compared with modeled flows for this calendar day. Not a gauge measurement.</div>`;
    });
    function nwmLatest() {   // date of the model run being shown
        if (!NWM.latestP) NWM.latestP = fetch(NWM.url + '/' + NWM.layer + '/query?where=1%3D1&returnGeometry=false&outStatistics=' + encodeURIComponent(JSON.stringify([{ statisticType: 'max', onStatisticField: 'valid_time', outStatisticFieldName: 'vt' }])) + '&f=json')
            .then(r => r.json()).then(j => {
                const a = j.features && j.features[0] && j.features[0].attributes; const t = a && (a.vt ?? a.VT);
                if (t) { NWM.asOf = t; const d = new Date(typeof t === 'number' ? t : String(t).replace(' ', 'T') + 'Z');
                    const txt = 'as of ' + (isNaN(d) ? String(t).slice(0, 10) : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }));
                    document.querySelectorAll('.nwm-asof').forEach(e => e.textContent = txt); }
                return t;
            }).catch(() => null);

    }
    function usdmLatest() {   // date of the most recent weekly map
        if (!USDM.latestP) USDM.latestP = fetch(USDM.cur + '/query?where=1%3D1&outFields=MapDate&returnGeometry=false&resultRecordCount=1&f=json')
            .then(r => r.json()).then(j => { USDM.asOf = j.features[0].attributes.MapDate; document.querySelectorAll('.usdm-asof').forEach(e => e.textContent = 'as of ' + usdmDate(USDM.asOf)); return USDM.asOf; })
            .catch(() => null);

    }
    // Weekly drought level at a point for the last `years` years → Map(dayKey → 0..4); weeks absent = no drought
    async function usdmPointHistory(lat, lng, years) {
        const since = new Date(Date.now() - years * 365.25 * 864e5).toISOString().slice(0, 10);
        const qs = 'where=' + encodeURIComponent(`ddate >= DATE '${since}'`) + '&geometry=' + encodeURIComponent(JSON.stringify({ x: lng, y: lat, spatialReference: { wkid: 4326 } }))
            + '&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&groupByFieldsForStatistics=ddate&orderByFields=ddate'
            + '&outStatistics=' + encodeURIComponent(JSON.stringify([{ statisticType: 'max', onStatisticField: 'dm', outStatisticFieldName: 'maxdm' }])) + '&f=json';
        const out = new Map(); let off = 0;
        for (let page = 0; page < 60; page++) {
            const j = await (await fetch(`${USDM.hist}/query?${qs}&resultOffset=${off}`)).json();
            if (j.error) throw new Error(j.error.message || 'USDM query failed');
            (j.features || []).forEach(f => out.set(new Date(f.attributes.ddate).toISOString().slice(0, 10), f.attributes.maxdm));
            if (!j.exceededTransferLimit || !(j.features || []).length) break;
            off += j.features.length;

        return out;
    }
    function usdmWeeks(latest, years) {   // list of weekly map dates (UTC day keys), oldest first
        const w = [], n = Math.round(years * 52.18);
        for (let i = n - 1; i >= 0; i--) w.push(new Date(latest - i * 7 * 864e5).toISOString().slice(0, 10));
        return w;
    }
    // Site: weekly level at the point
    async function usdmSiteSeries(lat, lng, years = 5) {
        const latest = await usdmLatest(); if (!latest) throw new Error('Drought Monitor unavailable');
        const h = await usdmPointHistory(lat, lng, years);

    }
    // Area: weekly share of sample points in each level (points spread across the polygon)
    async function usdmAreaSeries(poly, years = 5, nPts = 9) {
        const latest = await usdmLatest(); if (!latest) throw new Error('Drought Monitor unavailable');
        const [w, so, e, n] = turf.bbox(poly), pts = [];
        for (let gy = 0; gy < 7; gy++) for (let gx = 0; gx < 7; gx++) {
            const lng = w + (e - w) * (gx + .5) / 7, lat = so + (n - so) * (gy + .5) / 7;
            if (inPoly(poly, lat, lng)) pts.push([lat, lng]); }
        const pick = pts.length <= nPts ? pts : Array.from({ length: nPts }, (_, i) => pts[Math.floor(i * pts.length / nPts)]);
        if (!pick.length) { const c = turf.pointOnFeature(poly).geometry.coordinates; pick.push([c[1], c[0]]); }
        const hs = [];
        for (let i = 0; i < pick.length; i += 3) hs.push(...await Promise.all(pick.slice(i, i + 3).map(p => usdmPointHistory(p[0], p[1], years))));
        return { latest, nPts: pick.length, weeks: usdmWeeks(latest, years).map(k => {
            const atLeast = [0, 1, 2, 3, 4].map(c => hs.filter(h => (h.has(k) ? h.get(k) : -1) >= c).length / hs.length * 100);
            return { k, atLeast }; }) };
    }
    // Chart: site = weekly colored bands (+ monthly use line if given); area = stacked % of area by level
    function brDroughtChart(ser, monthly) {
        const W = 700, H = 160, L0 = 58, R0 = 10, T0 = 10, B0 = 24, wk = ser.weeks, N = wk.length;
        const xv = i => L0 + (W - L0 - R0) * i / N, bw = (W - L0 - R0) / N + 0.4;
        let g = '';
        // year ticks
        wk.forEach((w, i) => { if (i > 0 && w.k.slice(0, 4) !== wk[i - 1].k.slice(0, 4)) { const x = xv(i);
            g += `<line x1="${x}" x2="${x}" y1="${T0}" y2="${H - B0}" stroke="#e2e8f0"/><text x="${x + 3}" y="${H - 9}" font-size="9" fill="#475569">${w.k.slice(0, 4)}</text>`; } });
        if (ser.nPts == null) {   // site: full-height bands
            wk.forEach((w, i) => { if (w.dm >= 0) g += `<rect x="${xv(i).toFixed(2)}" y="${T0}" width="${bw.toFixed(2)}" height="${H - T0 - B0}" fill="${USDM.colors[w.dm]}" opacity=".75"><title>${w.k}: ${USDM.names[w.dm]}</title></rect>`; });
            const ks = Object.keys(monthly || {}).filter(k => k >= wk[0].k.slice(0, 7)).sort();
            if (ks.length >= 2) {
                const max = Math.max(1, ...ks.map(k => monthly[k])), step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step;
                const yv = v => T0 + (H - T0 - B0) * (1 - v / top);
                const t0 = Date.parse(wk[0].k), t1 = Date.parse(wk[N - 1].k) + 7 * 864e5;
                const xm = k => L0 + (W - L0 - R0) * (Date.parse(k + '-15') - t0) / (t1 - t0);
                for (let i = 0; i <= 4; i++) { const v = top * i / 4; g += `<text x="${L0 - 6}" y="${yv(v) + 3}" text-anchor="end" font-size="9" fill="#64748b">${brGal(v).replace(' gal', '')}</text>`; }
                g += `<path d="${ks.map((k, i) => (i ? 'L' : 'M') + xm(k).toFixed(1) + ',' + yv(monthly[k]).toFixed(1)).join(' ')}" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>`;
                ks.forEach(k => g += `<circle cx="${xm(k).toFixed(1)}" cy="${yv(monthly[k]).toFixed(1)}" r="2" fill="#0f172a"><title>${k}: ${brGal(monthly[k])}</title></circle>`);
                g += `<text x="${L0}" y="${T0 - 1}" font-size="8.5" fill="#0f172a" font-weight="700">— Monthly reported use</text>`;
            }
        } else {   // area: stacked % (nested categories: draw D0+ first, D4 last)
            const yv = v => T0 + (H - T0 - B0) * (1 - v / 100);
            [0, 25, 50, 75, 100].forEach(v => g += `<line x1="${L0}" x2="${W - R0}" y1="${yv(v)}" y2="${yv(v)}" stroke="#eef2f6"/><text x="${L0 - 6}" y="${yv(v) + 3}" text-anchor="end" font-size="9" fill="#64748b">${v}%</text>`);
            for (let c = 0; c < 5; c++) {
                const pts = wk.map((w, i) => `${(xv(i) + bw / 2).toFixed(1)},${yv(w.atLeast[c]).toFixed(1)}`);
                g += `<path d="M${L0},${yv(0)} L${pts.join(' L')} L${W - R0},${yv(0)} Z" fill="${USDM.colors[c]}" opacity=".85"/>`;
            }
        }
        g += `<line x1="${L0}" x2="${W - R0}" y1="${H - B0}" y2="${H - B0}" stroke="#94a3b8"/>`;
        const leg = USDM.names.map((n, i) => `<span><i style="background:${USDM.colors[i]}"></i>${n}</span>`).join('');
        return `<div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Drought history">${g}</svg></div><div class="br-maplegend" style="margin-top:2px">${leg}</div>`;
    }
    async function brDroughtSection(d, kind) {
        const el = $('br-drought'); if (!el) return;

            if (kind === 'site') {

                    &nbsp;as of ${usdmDate(ser.latest)} · <b>${yr}</b> of the last 52 weeks in drought (D1+)</p>${brDroughtChart(ser, d.s.monthly)}
                    <p class="note">Weekly U.S. Drought Monitor level at the site, last 5 years${d.s.monthly && Object.keys(d.s.monthly).length > 1 ? ', with the site\'s monthly reported water use' : ''}.</p>`;

    // ── GROUNDWATER: USGS continuously monitored wells (Water Data OGC API, depth to water, parameter 72019) ──
    // Color = today's level compared with the same time of year in the well's last 10 years (percentile of water level).
    const GW = {
        api: 'https://api.waterdata.usgs.gov/ogcapi/v0/collections', minZoom: 8, wells: {}, hist: {}, pending: {},
        cls: {
            much_below: { c: '#dc2626', t: 'Much below normal', r: '< 10th percentile' },
            below:      { c: '#f59e0b', t: 'Below normal',      r: '10th–24th percentile' },
            normal:     { c: '#94a3b8', t: 'Normal',            r: '25th–75th percentile' },
            above:      { c: '#2563eb', t: 'Above normal',      r: '> 75th percentile' },
            none:       { c: '#ffffff', t: 'No recent reading or short record', r: '' }
        }
    };
    const gwLayer = L.layerGroup();
    const gwRenderer = L.svg({ pane: 'plantPane', padding: 0.3 });
    const gwStatPref = ['00003', '00001', '00002', '00008'];   // daily mean, then max, min, median
    async function gwFetchLatest(bbox) {   // wells with a daily depth-to-water series inside bbox [w,s,e,n]
        const u = `${GW.api}/latest-daily/items?f=json&limit=2000&parameter_code=72019&bbox=${bbox.map(v => v.toFixed(4)).join(',')}&properties=monitoring_location_id,statistic_id,time,value`;
        const j = await (await fetch(u)).json();
        (j.features || []).forEach(f => { const p = f.properties, id = p.monitoring_location_id;
            const cur = GW.wells[id], rank = gwStatPref.indexOf(p.statistic_id) < 0 ? 9 : gwStatPref.indexOf(p.statistic_id);
            if (!cur || rank < cur.rank) GW.wells[id] = Object.assign(cur || {}, { id, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], stat: p.statistic_id, rank, time: p.time, value: parseFloat(p.value) }); });
        return Object.values(GW.wells).filter(w => w.lng >= bbox[0] && w.lng <= bbox[2] && w.lat >= bbox[1] && w.lat <= bbox[3]);
    }
    // 10-year daily record → { series: [[dayKey, depth]], pct, cls }
    async function gwHistory(w) {
        if (GW.hist[w.id]) return GW.hist[w.id];
        if (GW.pending[w.id]) return GW.pending[w.id];
        GW.pending[w.id] = (async () => {
            const since = new Date(Date.now() - 10 * 365.25 * 864e5).toISOString().slice(0, 10);
            const j = await (await fetch(`${GW.api}/daily/items?f=json&monitoring_location_id=${w.id}&parameter_code=72019&statistic_id=${w.stat}&time=${since}/..&limit=20000&skipGeometry=true&properties=time,value`)).json();
            const series = (j.features || []).map(f => [f.properties.time, parseFloat(f.properties.value)]).filter(r => !isNaN(r[1])).sort((a, b) => a[0] < b[0] ? -1 : 1);
            const h = { series, pct: null, cls: 'none' };
            const recent = w.time && (Date.now() - Date.parse(w.time)) < 60 * 864e5;
            if (recent && series.length) {
                const doy = t => { const d = new Date(t + 'T00:00:00Z'); return (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5; };
                const d0 = doy(w.time), y0 = w.time.slice(0, 4);
                const win = series.filter(([t]) => t.slice(0, 4) !== y0 && Math.min(Math.abs(doy(t) - d0), 365 - Math.abs(doy(t) - d0)) <= 15).map(r => r[1]);
                if (new Set(series.filter(([t]) => t.slice(0, 4) !== y0).map(([t]) => t.slice(0, 4))).size >= 5 && win.length >= 60) {

                    const deeper = win.filter(v => v > w.value).length, same = win.filter(v => v === w.value).length;
                    h.pct = (deeper + same / 2) / win.length * 100;
                    h.cls = h.pct < 10 ? 'much_below' : h.pct < 25 ? 'below' : h.pct <= 75 ? 'normal' : 'above';
                }
            }
            GW.hist[w.id] = h; return h;
        })().catch(() => (GW.hist[w.id] = { series: [], pct: null, cls: 'none' }));
        return GW.pending[w.id];
    }
    const gwPctTxt = p => { if (p == null) return ''; if (p < 1) return 'lowest for this time of year in 10 years'; if (p > 99) return 'highest for this time of year in 10 years';
        const n = Math.round(p), s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'); return `${n}${s} percentile for this time of year`; };
    const gwLink = id => `https://waterdata.usgs.gov/monitoring-location/${id.replace(/^USGS-/, '')}/`;
    const gwDate = t => t ? new Date(t + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    async function gwPopup(w) {
        let meta = {};
        try { const j = await (await fetch(`${GW.api}/monitoring-locations/items?f=json&id=${w.id}&properties=monitoring_location_name,county_name,state_name,well_constructed_depth,aquifer_code,national_aquifer_code`)).json(); meta = (j.features[0] || {}).properties || {}; } catch (e) {}
        const h = await gwHistory(w), c = GW.cls[h.cls];
        return `<div class="utility-header" style="color:#1e3a8a">USGS Groundwater Well</div>
            <div class="site-name">${meta.monitoring_location_name || w.id}</div>
            <div class="analysis-box">
                <div class="stat-row"><span>Status:</span><strong><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.c};box-shadow:0 0 0 1px #1e3a8a;margin-right:5px;vertical-align:-1px"></span>${c.t}</strong></div>${h.pct != null ? `<div class="stat-row"><span></span><strong style="font-weight:400;color:#475569">${gwPctTxt(h.pct)}</strong>` : ''}</div>
                <div class="stat-row"><span>Depth to water:</span><strong>${isNaN(w.value) ? '—' : w.value.toFixed(2) + ' ft'} <span style="color:#64748b;font-weight:400">(${gwDate(w.time)})</span></strong></div>
                <div class="stat-row"><span>Location:</span><strong>${[meta.county_name, meta.state_name].filter(Boolean).join(', ') || '—'}</strong></div>
                <div class="stat-row"><span>Well depth:</span><strong>${meta.well_constructed_depth ? meta.well_constructed_depth + ' ft' : '—'}</strong></div>
            </div>

    }
    let gwSeq = 0;
    async function renderGroundwater() {

        const seq = ++gwSeq, b = map.getBounds().pad(0.1);
        let wells; try { wells = await gwFetchLatest([b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]); } catch (e) { if (note) note.textContent = 'USGS data unavailable'; return; }
        if (seq !== gwSeq) return;

        const draw = w => { const h = GW.hist[w.id], c = GW.cls[h ? h.cls : 'none'];

    // Report helper: nearest well with a current reading → monthly means + monthly normal band (25th–75th pct.)
    async function gwForReport(lat, lng, poly) {
        const pad = 0.35, bb = poly ? turf.bbox(poly) : [lng - pad, lat - pad, lng + pad, lat + pad];
        let wells = await gwFetchLatest([bb[0] - 0.05, bb[1] - 0.05, bb[2] + 0.05, bb[3] + 0.05]);
        if (!wells.length && poly) wells = await gwFetchLatest([lng - pad, lat - pad, lng + pad, lat + pad]);
        const here = { lat, lng };
        const ranked = wells.map(w => ({ w, d: miles(here, w), inside: poly ? inPoly(poly, w.lat, w.lng) : false, recent: w.time && (Date.now() - Date.parse(w.time)) < 60 * 864e5 }))
            .filter(x => x.recent && (poly ? true : x.d <= 20)).sort((a, b) => (b.inside - a.inside) || (a.d - b.d));
        for (const x of ranked.slice(0, 4)) {
            const h = await gwHistory(x.w);
            if (h.series.length < 365) continue;
            let meta = {};
            try { const j = await (await fetch(`${GW.api}/monitoring-locations/items?f=json&id=${x.w.id}&properties=monitoring_location_name,county_name,state_name,well_constructed_depth`)).json(); meta = (j.features[0] || {}).properties || {}; } catch (e) {}
            const byMonth = {}, byCal = {};
            h.series.forEach(([t, v]) => { (byMonth[t.slice(0, 7)] = byMonth[t.slice(0, 7)] || []).push(v); (byCal[t.slice(5, 7)] = byCal[t.slice(5, 7)] || []).push(v); });
            const q = (a, p) => { const s = a.slice().sort((x, y) => x - y); const i = (s.length - 1) * p, lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo); };
            const monthly = Object.keys(byMonth).sort().map(k => [k, byMonth[k].reduce((s, v) => s + v, 0) / byMonth[k].length]);
            const band = {}; Object.keys(byCal).forEach(m => band[m] = [q(byCal[m], .25), q(byCal[m], .75)]);

        }
        return null;
    }
    function brGroundwaterChart(g) {
        const W = 700, H = 160, L0 = 58, R0 = 10, T0 = 12, B0 = 24, ms = g.monthly, N = ms.length;
        const vals = ms.map(m => m[1]).concat(...Object.values(g.band));
        let lo = Math.min(...vals), hi = Math.max(...vals); const padv = Math.max(0.5, (hi - lo) * 0.12); lo = Math.max(0, lo - padv); hi += padv;
        const yv = v => T0 + (H - T0 - B0) * (v - lo) / (hi - lo);   // depth grows downward
        const xv = i => L0 + (W - L0 - R0) * i / Math.max(1, N - 1), bw = (W - L0 - R0) / Math.max(1, N - 1);
        let gsv = '';
        for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; gsv += `<line x1="${L0}" x2="${W - R0}" y1="${yv(v)}" y2="${yv(v)}" stroke="#eef2f6"/><text x="${L0 - 6}" y="${yv(v) + 3}" text-anchor="end" font-size="9" fill="#64748b">${v.toFixed(v < 10 ? 1 : 0)} ft</text>`; }
        ms.forEach(([k], i) => { const b = g.band[k.slice(5, 7)]; if (b) gsv += `<rect x="${(xv(i) - bw / 2).toFixed(1)}" y="${yv(b[0]).toFixed(1)}" width="${(bw + .4).toFixed(1)}" height="${Math.max(.5, yv(b[1]) - yv(b[0])).toFixed(1)}" fill="#cbd5e1" opacity=".55"/>`;
            if (k.slice(5, 7) === '01') gsv += `<line x1="${xv(i)}" x2="${xv(i)}" y1="${T0}" y2="${H - B0}" stroke="#e2e8f0"/><text x="${xv(i) + 3}" y="${H - 9}" font-size="9" fill="#475569">${k.slice(0, 4)}</text>`; });
        let path = '', prev = null;
        ms.forEach(([k, v], i) => { const gap = prev && (Date.parse(k + '-01') - Date.parse(prev + '-01')) > 40 * 864e5; path += (path && !gap ? 'L' : 'M') + xv(i).toFixed(1) + ',' + yv(v).toFixed(1) + ' '; prev = k; });
        gsv += `<path d="${path}" fill="none" stroke="#1e6fd9" stroke-width="1.8" stroke-linejoin="round"/>`;
        gsv += `<line x1="${L0}" x2="${W - R0}" y1="${H - B0}" y2="${H - B0}" stroke="#94a3b8"/>`;
        return `<div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Groundwater level">${gsv}</svg></div>
            <div class="br-maplegend" style="margin-top:2px"><span><i style="background:#1e6fd9;border-radius:2px;height:3px;vertical-align:2px"></i>Monthly average depth to water</span><span><i style="background:#cbd5e1;border-radius:2px"></i>Normal range for the month (25th–75th percentile)</span><span>Lower on the chart = deeper water table</span></div>`;
    }
    async function brGroundwaterSection(d, kind) {

            const g = await gwForReport(at.lat, at.lng, kind === 'site' ? null : br.feature); d.gw = g;
            if (!g) { el.innerHTML = `<p class="note">No USGS well with a current daily water-level record ${kind === 'site' ? 'within 20 miles' : 'in or near this area'}.</p>`; return; }
            const c = GW.cls[g.h.cls];
            el.innerHTML = `<p style="margin:0 0 6px;font-size:12.5px"><b style="display:inline-block;padding:1px 8px;border-radius:999px;background:${c.c};color:${g.h.cls === 'normal' || g.h.cls === 'none' ? '#0f172a' : '#fff'}">${c.t}</b>

    // ── STREAMGAGES: USGS continuous monitoring stations (Water Data OGC API: latest-continuous, continuous, daily) ──
    // Colour = current streamflow compared with daily mean flows for the same time of year (±7 days) in the gage's last 10 years.
    const SG = {
        minZoom: 7, sites: {}, hist: {}, pending: {},
        cls: {
            much_above: { c: '#1d4ed8', t: 'Much above normal', r: '> 90th percentile' },
            above:      { c: '#22d3ee', t: 'Above normal',      r: '76th–90th percentile' },
            normal:     { c: '#22c55e', t: 'Normal',            r: '25th–75th percentile' },
            below:      { c: '#f59e0b', t: 'Below normal',      r: '10th–24th percentile' },
            much_below: { c: '#b91c1c', t: 'Much below normal', r: '< 10th percentile' },
            none:       { c: '#ffffff', t: 'Water level only, or no recent / long enough flow record', r: '' }
        }
    };
    const sgLayer = L.layerGroup();
    const sgRenderer = L.svg({ pane: 'plantPane', padding: 0.3 });
    const sgTitle = s => String(s || '').toLowerCase().replace(/\b([a-z])/g, m => m.toUpperCase()).replace(/\b(Nr|Ab|Bl|At|Near|Above|Below|Of|And|The)\b/g, m => m.toLowerCase())
        .replace(/\b(Md|Va|Dc|Wv|Pa|Nc|Us|Usgs|Sta)\b/gi, m => m.toUpperCase());
    // "POTOMAC RIVER NEAR WASH, DC LITTLE FALLS PUMP STA" → "Potomac River"
    const sgStream = n => { if (!n) return ''; const m = String(n).split(/\s+(?:NEAR|NR|AT|AB|ABOVE|BL|BELOW|ABV|BLW|@|TRIB TO|TRIBUTARY TO)\s+/i)[0].replace(/,.*$/, ''); return sgTitle(m.trim()); };
    async function sgFetchLatest(bbox) {   // stations with a live flow and/or water-level series in bbox [w,s,e,n]
        const bb = bbox.map(v => v.toFixed(4)).join(',');
        const q = pc => fetch(`${GW.api}/latest-continuous/items?f=json&limit=5000&parameter_code=${pc}&bbox=${bb}&properties=monitoring_location_id,time,value`)
            .then(r => r.json()).catch(() => ({ features: [] }));
        const [flow, stage] = await Promise.all([q('00060'), q('00065')]);
        const put = (f, key) => { const p = f.properties, id = p.monitoring_location_id, v = parseFloat(p.value);
            if (!f.geometry || isNaN(v) || v <= -9999) return;
            const s = SG.sites[id] || (SG.sites[id] = { id, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] });
            if (!s[key + 'Time'] || p.time > s[key + 'Time']) { s[key] = v; s[key + 'Time'] = p.time; } };
        (flow.features || []).forEach(f => put(f, 'q'));
        (stage.features || []).forEach(f => put(f, 'gh'));
        const inView = Object.values(SG.sites).filter(s => s.lng >= bbox[0] && s.lng <= bbox[2] && s.lat >= bbox[1] && s.lat <= bbox[3]);
        const need = inView.filter(s => s.name === undefined).map(s => s.id);   // station names, 100 at a time
        for (let i = 0; i < need.length; i += 100) {
            try { const j = await (await fetch(`${GW.api}/monitoring-locations/items?f=json&limit=100&id=${need.slice(i, i + 100).join(',')}&properties=monitoring_location_name,drainage_area,county_name,state_name`)).json();
                (j.features || []).forEach(f => { const s = SG.sites[f.id]; if (s) Object.assign(s, { name: f.properties.monitoring_location_name || '', area: f.properties.drainage_area, county: f.properties.county_name, state: f.properties.state_name }); }); } catch (e) { /* names optional */ }
            need.slice(i, i + 100).forEach(id => { if (SG.sites[id].name === undefined) SG.sites[id].name = ''; });
        }
        return inView;
    }
    const sgRecent = s => s.qTime && (Date.now() - Date.parse(s.qTime)) < 3 * 864e5;
    const sgQ = (a, p) => { const s = a.slice().sort((x, y) => x - y); if (!s.length) return null; const i = (s.length - 1) * p, lo = Math.floor(i); return s[lo] + (s[Math.ceil(i)] - s[lo]) * (i - lo); };
    // 10-year daily mean flow → { series, pct, cls, band: [p25, p75] for today }
    async function sgHistory(s) {
        if (SG.hist[s.id]) return SG.hist[s.id];
        if (SG.pending[s.id]) return SG.pending[s.id];
        SG.pending[s.id] = (async () => {
            const h = { series: [], pct: null, cls: 'none', band: null };
            if (s.q == null) return (SG.hist[s.id] = h);
            const since = new Date(Date.now() - 10 * 365.25 * 864e5).toISOString().slice(0, 10);
            const j = await (await fetch(`${GW.api}/daily/items?f=json&monitoring_location_id=${s.id}&parameter_code=00060&statistic_id=00003&time=${since}/..&limit=20000&skipGeometry=true&properties=time,value`)).json();
            h.series = (j.features || []).map(f => [f.properties.time, parseFloat(f.properties.value)]).filter(r => !isNaN(r[1]) && r[1] >= 0).sort((a, b) => a[0] < b[0] ? -1 : 1);
            if (sgRecent(s) && h.series.length) {
                const doy = t => { const d = new Date(t.slice(0, 10) + 'T00:00:00Z'); return (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5; };

                const win = other.filter(([t]) => Math.min(Math.abs(doy(t) - d0), 365 - Math.abs(doy(t) - d0)) <= 7).map(r => r[1]);
                if (new Set(other.map(([t]) => t.slice(0, 4))).size >= 5 && win.length >= 50) {
                    const below = win.filter(v => v < s.q).length, same = win.filter(v => v === s.q).length;
                    h.pct = (below + same / 2) / win.length * 100;
                    h.cls = h.pct < 10 ? 'much_below' : h.pct < 25 ? 'below' : h.pct <= 75 ? 'normal' : h.pct <= 90 ? 'above' : 'much_above';
                    h.band = [sgQ(win, .25), sgQ(win, .75)];
                }

            return (SG.hist[s.id] = h);
        })().catch(() => (SG.hist[s.id] = { series: [], pct: null, cls: 'none', band: null }));

    }
    const sgNum = (v, u) => v == null || isNaN(v) ? '—' : (Math.abs(v) >= 100 ? Math.round(v).toLocaleString() : (+v).toFixed(Math.abs(v) >= 10 ? 1 : 2)) + (u ? ' ' + u : '');
    const sgTime = t => t ? new Date(t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
    const sgPctTxt = p => { if (p == null) return ''; if (p < 1) return 'lowest for this time of year in 10 years'; if (p > 99) return 'highest for this time of year in 10 years';
        const n = Math.round(p), sfx = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'); return `${n}${sfx} percentile for this time of year`; };
    // Last 7 days of 15-minute readings as a small hydrograph (flow if available, otherwise water level)
    async function sgSpark(s, h) {
        const pc = s.q != null ? '00060' : '00065', since = new Date(Date.now() - 7 * 864e5).toISOString();
        let pts = [];
        try { const j = await (await fetch(`${GW.api}/continuous/items?f=json&monitoring_location_id=${s.id}&parameter_code=${pc}&time=${since}/..&limit=5000&skipGeometry=true&properties=time,value`)).json();
            pts = (j.features || []).map(f => [Date.parse(f.properties.time), parseFloat(f.properties.value)]).filter(r => !isNaN(r[1]) && r[1] > -9999).sort((a, b) => a[0] - b[0]); } catch (e) { return ''; }
        if (pts.length < 4) return '';
        const W = 300, H = 74, P = 4, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
        let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
        const band = pc === '00060' && h && h.band ? h.band : null;
        if (band) { lo = Math.min(lo, band[0]); hi = Math.max(hi, band[1]); }
        if (hi === lo) { hi += 1; lo -= 1; }
        const x = t => P + (W - 2 * P) * (t - t0) / Math.max(1, t1 - t0), y = v => H - P - (H - 2 * P) * (v - lo) / (hi - lo);
        const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)).join('');
        const bandRect = band ? `<rect x="${P}" y="${y(band[1]).toFixed(1)}" width="${W - 2 * P}" height="${Math.max(1, y(band[0]) - y(band[1])).toFixed(1)}" fill="#dcfce7"/>` : '';
        return `<div style="margin-top:6px"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="background:#f8fafc;border-radius:6px">${bandRect}<path d="${d}" fill="none" stroke="#1e6fd9" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <div style="display:flex;justify-content:space-between;font-size:10px;color:#64748b"><span>${new Date(t0).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</span><span>Last 7 days · ${pc === '00060' ? 'flow' : 'water level'}${band ? ' · green band = normal range' : ''}</span><span>now</span></div></div>`;
    }
    async function sgPopup(s) {
        const h = await sgHistory(s), c = SG.cls[h.cls], stream = sgStream(s.name);
        const spark = await sgSpark(s, h);
        return `<div class="utility-header" style="color:#1d4ed8">USGS Streamgage · live</div>
            <div class="site-name">${gcEsc(stream || s.id)}</div>
            <div style="font-size:11px;color:#64748b;margin:-4px 0 6px">${gcEsc(sgTitle(s.name) || '')}</div>
            <div class="analysis-box">
                <div class="stat-row"><span>Status:</span><strong><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.c};box-shadow:0 0 0 1px #1e3a8a;margin-right:5px;vertical-align:-1px"></span>${c.t}</strong></div>
                ${h.pct != null ? `<div style="font-size:11px;color:#475569;margin:-2px 0 4px;text-align:right">${sgPctTxt(h.pct)}</div>` : ''}
                <div class="stat-row"><span>Streamflow:</span><strong>${sgNum(s.q, 'cfs')} <span style="color:#64748b;font-weight:400">${s.qTime ? '(' + sgTime(s.qTime) + ')' : ''}</span></strong></div>
                ${h.band ? `<div class="stat-row"><span>Normal for this time of year:</span><strong>${sgNum(h.band[0])} – ${sgNum(h.band[1], 'cfs')}</strong></div>` : ''}
                <div class="stat-row"><span>Water level (gage height):</span><strong>${sgNum(s.gh, 'ft')} <span style="color:#64748b;font-weight:400">${s.ghTime ? '(' + sgTime(s.ghTime) + ')' : ''}</span></strong></div>
                <div class="stat-row"><span>Drainage area:</span><strong>${s.area ? Number(s.area).toLocaleString() + ' sq mi' : '—'}</strong></div>

            </div>

            <p style="font-size:11px;color:#64748b;margin:6px 0 0">Provisional USGS data, updated every 15–60 minutes. Status compares current flow with daily mean flows for the same time of year (±7 days) over the last 10 years. <a href="${gwLink(s.id)}" target="_blank" rel="noopener">USGS station ${s.id.replace('USGS-', '')}</a></p>`;
    }
    let sgSeq = 0;
    async function renderStreamgages() {

        const draw = s => {

                .bindPopup('Loading live readings…', { maxWidth: 340, minWidth: 280 })
                .on('popupopen', async ev => { ev.popup.setContent(await sgPopup(s)); ev.popup.update(); s.marker.setStyle(style(s)); track('facility_view', { dataset: 'USGS streamgage' }); })
                .addTo(sgLayer);

    }
    sgLayer.on('add', () => setTimeout(renderStreamgages, 0));
    map.on('moveend', () => renderStreamgages());

    // Rivers & Streams: click a line for its name, and the nearest live USGS streamgage
    riversLayer.bindPopup(function (err, fc, resp) {
        const feats = (!err && fc && fc.features) || [];
        const named = feats.find(f => { const n = (f.properties || {}).GNIS_NAME; return n && n !== 'Null'; }) || feats[0];
        if (!named) return false;
        const a = named.properties || {}, nm = a.GNIS_NAME && a.GNIS_NAME !== 'Null' ? a.GNIS_NAME : 'Unnamed stream';
        const km = parseFloat(a.LENGTHKM), id = 'rv' + Date.now();
        const ll = riversLayer._lastLL;
        setTimeout(async () => {
            const el = document.getElementById(id); if (!el || !ll) return;
            try {
                const d = 0.25, sites = await sgFetchLatest([ll.lng - d, ll.lat - d, ll.lng + d, ll.lat + d]);
                const best = sites.filter(x => x.q != null || x.gh != null).map(x => ({ x, mi: miles(ll, x) })).sort((p, q) => p.mi - q.mi)[0];
                if (!best) { el.innerHTML = '<span style="color:#64748b">No live USGS streamgage within about 15 miles.</span>'; return; }
                const x = best.x, h = SG.hist[x.id];
                el.innerHTML = `<div class="stat-row"><span>Nearest live gage:</span><strong>${gcEsc(sgStream(x.name) || x.id)} · ${best.mi.toFixed(1)} mi</strong></div>
                    <div class="stat-row"><span>Now:</span><strong>${x.q != null ? sgNum(x.q, 'cfs') : sgNum(x.gh, 'ft')}${h && h.cls !== 'none' ? ' · ' + SG.cls[h.cls].t.toLowerCase() : ''}</strong></div>
                    ${map.hasLayer(sgLayer) ? '' : `<button type="button" class="br-open" style="margin-top:6px" onclick="(function(){var c=document.querySelector('#sidebar input[data-id=&quot;sg&quot;]');if(c&&!c.checked){c.checked=true;c.dispatchEvent(new Event('change'));}})()">Show live streamgages <span class="lp-lock" title="Pro layer">PRO</span></button>`}`;
            } catch (e) { el.innerHTML = '<span style="color:#64748b">USGS live data unavailable right now.</span>'; }
        }, 0);
        return `<div class="utility-header" style="color:#0e7490">River / stream</div>
            <div class="site-name">${gcEsc(nm)}</div>
            <div class="analysis-box">
                <div class="stat-row"><span>Type:</span><strong>${gcEsc(a.FCode || a.FType || '—')}</strong></div>
                ${!isNaN(km) ? `<div class="stat-row"><span>This segment:</span><strong>${(km * 0.621371).toFixed(2)} mi</strong></div>` : ''}
                <div class="stat-row"><span>NHD reach code:</span><strong>${gcEsc(a.REACHCODE || '—')}</strong></div>
                <div id="${id}" style="margin-top:4px"><span class="br-muted">Finding the nearest live streamgage…</span></div>
            </div>
            <p style="font-size:11px;color:#64748b;margin:6px 0 0">USGS National Hydrography Dataset.</p>`;
    });
    map.on('click', e => { riversLayer._lastLL = e.latlng; });

    // Report helper: nearest streamgage with a current flow reading → monthly mean flow + monthly normal band (25th–75th pct. of daily means)
    async function sgForReport(lat, lng, poly) {
        const pad = 0.35, bb = poly ? turf.bbox(poly) : [lng - pad, lat - pad, lng + pad, lat + pad];
        let sites = await sgFetchLatest([bb[0] - 0.05, bb[1] - 0.05, bb[2] + 0.05, bb[3] + 0.05]);
        if (!sites.length && poly) sites = await sgFetchLatest([lng - pad, lat - pad, lng + pad, lat + pad]);
        const here = { lat, lng };
        const ranked = sites.filter(s => s.q != null && sgRecent(s)).map(s => ({ s, d: miles(here, s), inside: poly ? inPoly(poly, s.lat, s.lng) : false }))
            .filter(x => poly ? true : x.d <= 20)
            .sort((a, b) => (b.inside - a.inside) || (poly && b.inside && a.inside ? (b.s.area || 0) - (a.s.area || 0) : a.d - b.d));   // in an area: the largest river inside it
        for (const x of ranked.slice(0, 4)) {
            const h = await sgHistory(x.s);
            if (h.series.length < 365 * 3) continue;
            const byMonth = {}, byCal = {};
            h.series.forEach(([t, v]) => { (byMonth[t.slice(0, 7)] = byMonth[t.slice(0, 7)] || []).push(v); (byCal[t.slice(5, 7)] = byCal[t.slice(5, 7)] || []).push(v); });
            const monthly = Object.keys(byMonth).sort().slice(-60).map(k => [k, byMonth[k].reduce((a, v) => a + v, 0) / byMonth[k].length]);
            const band = {}; Object.keys(byCal).forEach(m => band[m] = [sgQ(byCal[m], .25), sgQ(byCal[m], .75)]);
            return { s: x.s, d: x.d, inside: x.inside, h, monthly, band };
        }
        return null;
    }
    function brStreamflowChart(g) {
        const W = 700, H = 160, L0 = 64, R0 = 10, T0 = 12, B0 = 24, ms = g.monthly, N = ms.length;
        const vals = ms.map(m => m[1]).concat(...ms.map(([k]) => g.band[k.slice(5, 7)] || []));
        let lo = 0, hi = Math.max(...vals) * 1.08 || 1;
        const yv = v => H - B0 - (H - T0 - B0) * (v - lo) / (hi - lo);
        const xv = i => L0 + (W - L0 - R0) * i / Math.max(1, N - 1), bw = (W - L0 - R0) / Math.max(1, N - 1);
        let s = '';
        for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += `<line x1="${L0}" x2="${W - R0}" y1="${yv(v)}" y2="${yv(v)}" stroke="#eef2f6"/><text x="${L0 - 6}" y="${yv(v) + 3}" text-anchor="end" font-size="9" fill="#64748b">${sgNum(v)} cfs</text>`; }
        ms.forEach(([k], i) => { const b = g.band[k.slice(5, 7)]; if (b) s += `<rect x="${(xv(i) - bw / 2).toFixed(1)}" y="${yv(b[1]).toFixed(1)}" width="${(bw + .4).toFixed(1)}" height="${Math.max(.5, yv(b[0]) - yv(b[1])).toFixed(1)}" fill="#dcfce7"/>`;
            if (k.slice(5, 7) === '01') s += `<line x1="${xv(i)}" x2="${xv(i)}" y1="${T0}" y2="${H - B0}" stroke="#e2e8f0"/><text x="${xv(i) + 3}" y="${H - 9}" font-size="9" fill="#475569">${k.slice(0, 4)}</text>`; });
        let path = '', prev = null;
        ms.forEach(([k, v], i) => { const gap = prev && (Date.parse(k + '-01') - Date.parse(prev + '-01')) > 40 * 864e5; path += (path && !gap ? 'L' : 'M') + xv(i).toFixed(1) + ',' + yv(v).toFixed(1) + ' '; prev = k; });
        s += `<path d="${path}" fill="none" stroke="#1e6fd9" stroke-width="1.8" stroke-linejoin="round"/><line x1="${L0}" x2="${W - R0}" y1="${H - B0}" y2="${H - B0}" stroke="#94a3b8"/>`;
        return `<div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Streamflow">${s}</svg></div>
            <div class="br-maplegend" style="margin-top:2px"><span><i style="background:#1e6fd9;border-radius:2px;height:3px;vertical-align:2px"></i>Monthly average streamflow</span><span><i style="background:#dcfce7;border-radius:2px"></i>Normal range for the month (25th–75th percentile, last 10 years)</span></div>`;
    }
    // Last 7 days of 15-minute gage-height readings (ft)
    async function sgLevel7d(s) {
        const since = new Date(Date.now() - 7 * 864e5).toISOString();
        const j = await (await fetch(`${GW.api}/continuous/items?f=json&monitoring_location_id=${s.id}&parameter_code=00065&time=${since}/..&limit=5000&skipGeometry=true&properties=time,value`)).json();
        return (j.features || []).map(f => [Date.parse(f.properties.time), parseFloat(f.properties.value)]).filter(r => !isNaN(r[1]) && r[1] > -9999).sort((a, b) => a[0] - b[0]);
    }
    function brLevelChart(pts) {
        const W = 700, H = 140, L0 = 64, R0 = 10, T0 = 12, B0 = 24, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
        let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
        const padv = Math.max(0.1, (hi - lo) * 0.12); lo -= padv; hi += padv;
        const yv = v => H - B0 - (H - T0 - B0) * (v - lo) / (hi - lo), xv = t => L0 + (W - L0 - R0) * (t - t0) / Math.max(1, t1 - t0);
        let s = '';
        for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += `<line x1="${L0}" x2="${W - R0}" y1="${yv(v)}" y2="${yv(v)}" stroke="#eef2f6"/><text x="${L0 - 6}" y="${yv(v) + 3}" text-anchor="end" font-size="9" fill="#64748b">${v.toFixed(2)} ft</text>`; }
        const day = new Date(t0); day.setHours(0, 0, 0, 0);
        for (let t = day.getTime() + 864e5; t < t1; t += 864e5) s += `<line x1="${xv(t)}" x2="${xv(t)}" y1="${T0}" y2="${H - B0}" stroke="#e2e8f0"/><text x="${xv(t) + 3}" y="${H - 9}" font-size="9" fill="#475569">${new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>`;
        const d = pts.map((p, i) => (i ? 'L' : 'M') + xv(p[0]).toFixed(1) + ',' + yv(p[1]).toFixed(1)).join('');
        s += `<path d="${d}" fill="none" stroke="#0e7490" stroke-width="1.8" stroke-linejoin="round"/><line x1="${L0}" x2="${W - R0}" y1="${H - B0}" y2="${H - B0}" stroke="#94a3b8"/>`;
        return `<div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Water level, last 7 days">${s}</svg></div>
            <div class="br-maplegend" style="margin-top:2px"><span><i style="background:#0e7490;border-radius:2px;height:3px;vertical-align:2px"></i>Water level (gage height), 15-minute readings, last 7 days</span></div>`;
    }
    // Water level block for the report: the flow gage if it records gage height, otherwise the nearest gage that does
    async function brLevelBlock(d, at, poly, flowSite) {
        let s = flowSite && flowSite.gh != null ? flowSite : null;
        if (!s) {
            const recent = x => x.gh != null && x.ghTime && (Date.now() - Date.parse(x.ghTime)) < 3 * 864e5;
            const c = Object.values(SG.sites).filter(recent).map(x => ({ x, mi: miles(at, x), inside: poly ? inPoly(poly, x.lat, x.lng) : false }))
                .filter(o => o.inside || o.mi <= 20).sort((a, b) => (b.inside - a.inside) || a.mi - b.mi)[0];
            if (!c) return '';
            s = c.x; s._mi = c.mi; s._inside = c.inside;
        }
        let pts = []; try { pts = await sgLevel7d(s); } catch (e) { /* chart optional */ }
        d.sgl = { s, pts };
        const first = pts.length ? pts[0][1] : null, chg = first != null ? s.gh - first : null;
        const lo = pts.length ? Math.min(s.gh, ...pts.map(p => p[1])) : null, hi = pts.length ? Math.max(s.gh, ...pts.map(p => p[1])) : null;
        const same = flowSite && s === flowSite;
        return `<h4 style="margin:12px 0 4px;font-size:13px">Water level</h4>
            <p style="margin:0 0 6px;font-size:12.5px"><b>Water level now: ${sgNum(s.gh, 'ft')}</b> on ${sgTime(s.ghTime)}${chg != null ? ` · ${chg >= 0 ? '+' : '−'}${Math.abs(chg).toFixed(2)} ft over 7 days` : ''}${lo != null ? ` · 7-day range ${lo.toFixed(2)}–${hi.toFixed(2)} ft` : ''}</p>
            ${pts.length >= 4 ? brLevelChart(pts) : ''}
            <p class="note">${same ? 'Same streamgage as above.' : `USGS streamgage <a href="${gwLink(s.id)}">${s.id.replace('USGS-', '')}</a>${s.name ? ' (' + brEsc(sgTitle(s.name)) + ')' : ''}${s._inside ? ', inside the area' : s._mi != null ? `, ${s._mi.toFixed(1)} mi away` : ''}.`} Gage height is the water surface above a fixed local datum at the station, so it shows rises and falls at that gage but can't be compared between stations. Provisional data.</p>`;
    }
    async function brStreamflowSection(d, kind) {
        const el = $('br-sg'); if (!el) return;
        brStatus('Finding the nearest USGS streamgage…');
        d.sg = null; d.sgl = null;
        try {
            const at = kind === 'site' ? { lat: d.s.lat, lng: d.s.lng } : (() => { const c = turf.pointOnFeature(br.feature).geometry.coordinates; return { lat: c[1], lng: c[0] }; })();
            const poly = kind === 'site' ? null : br.feature;
            const g = await sgForReport(at.lat, at.lng, poly); d.sg = g;
            let html = '';
            if (!g) html = `<p class="note">No USGS streamgage with a current flow record ${kind === 'site' ? 'within 20 miles' : 'in or near this area'}.</p>`;
            else {
                const c = SG.cls[g.h.cls], stream = sgStream(g.s.name);
                html = `<p style="margin:0 0 6px;font-size:12.5px"><b style="display:inline-block;padding:1px 8px;border-radius:999px;background:${c.c};color:${['normal', 'none', 'above'].includes(g.h.cls) ? '#0f172a' : '#fff'}">${c.t}</b>
                &nbsp;${brEsc(stream || 'Stream')}: ${sgNum(g.s.q, 'cfs')} on ${sgTime(g.s.qTime)}${g.h.pct != null ? ' · ' + sgPctTxt(g.h.pct) : ''}${g.h.band ? ` (normal ${sgNum(g.h.band[0])}–${sgNum(g.h.band[1], 'cfs')})` : ''}</p>
                ${brStreamflowChart(g)}
                <p class="note">USGS streamgage <a href="${gwLink(g.s.id)}">${g.s.id.replace('USGS-', '')}</a>${g.s.name ? ' (' + brEsc(sgTitle(g.s.name)) + ')' : ''}${g.inside ? ', inside the area' : `, ${g.d.toFixed(1)} mi away`}${g.s.area ? `, drainage area ${Number(g.s.area).toLocaleString()} sq mi` : ''}. Monthly averages of daily mean flow, last 5 years; provisional data may be revised.</p>`;
            }
            brStatus('Loading water levels…');
            let lvl = ''; try { lvl = await brLevelBlock(d, at, poly, g && g.s); } catch (e) { d.sgl = null; }
            el.innerHTML = html + lvl;
        } catch (e) { el.innerHTML = '<p class="note">USGS streamflow data unavailable right now.</p>'; d.sg = null; d.sgl = null; }
    }

    // ── WATER DEMAND: county water withdrawals by sector (USGS, Estimated Use of Water in the U.S., 2015) ──
    // One county map per sector; only one sector is shown at a time. Data: data/water_demand.json (TopoJSON, admin/build_water_demand.py)
    const WD = {
        url: 'data/water_demand.json',
        data: null, loading: null,
        breaks: [1, 5, 20, 50, 150, 500],   // Mgal/d
        sectors: {
            dom: { t: 'Domestic',     long: 'Domestic water use',     v: p => p.d,  ramp: ['#eff6ff', '#bfdbfe', '#93c5fd', '#60a5fa', '#2563eb', '#1d4ed8', '#1e3a8a'],
                   note: 'Household indoor and outdoor use: homes on public supply plus self-supplied (private well) homes. Public-supply water may be withdrawn in a neighboring county, so domestic use can exceed a county\'s own withdrawals.' },
            ind: { t: 'Industrial',   long: 'Industrial water use',   v: p => (p.i == null && p.m == null) ? null : (p.i || 0) + (p.m || 0), ramp: ['#faf5ff', '#e9d5ff', '#d8b4fe', '#c084fc', '#9333ea', '#7e22ce', '#581c87'],
                   note: 'Self-supplied industrial plants (manufacturing, chemicals, food processing, paper, refining) plus mining. Industries on public supply are counted in public supply.' },
            agr: { t: 'Agricultural', long: 'Agricultural water use', v: p => (p.ir == null && p.li == null && p.aq == null) ? null : (p.ir || 0) + (p.li || 0) + (p.aq || 0), ramp: ['#f7fee7', '#d9f99d', '#bef264', '#84cc16', '#4d7c0f', '#3f6212', '#1a2e05'],
                   note: 'Crop and golf-course irrigation, livestock and aquaculture.' },
            pwr: { t: 'Power plants', long: 'Power plant cooling (thermoelectric)', v: p => p.t, ramp: ['#fff7ed', '#fed7aa', '#fdba74', '#fb923c', '#ea580c', '#c2410c', '#7c2d12'],
                   note: 'Cooling and process water for thermoelectric power plants (coal, gas, nuclear). Once-through cooling withdraws large volumes and returns most of it.' }
        },
        layers: {}
    };
    const wdRenderer = L.canvas({ padding: 0.3 });
    const wdFmt = v => v == null ? '—' : v >= 100 ? Math.round(v).toLocaleString() : v >= 10 ? v.toFixed(1) : v >= 1 ? v.toFixed(2) : v > 0 ? v.toFixed(2) : '0';
    const wdClass = v => { if (v == null) return -1; let i = 0; while (i < WD.breaks.length && v >= WD.breaks[i]) i++; return i; };
    function wdLoad() {
        if (WD.data) return Promise.resolve(WD.data);
        if (WD.loading) return WD.loading;
        const lib = window.topojson ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script');
            s.src = 'https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
        WD.loading = Promise.all([lib, fetch(WD.url).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })])
            .then(([, topo]) => (WD.data = topojson.feature(topo, topo.objects.counties)))
            .catch(e => { WD.loading = null; throw e; });
        return WD.loading;
    }
    function wdRows(p) {
        return [
            ['Domestic', p.d, WD.sectors.dom.ramp[5]],
            ['Industrial', p.i, WD.sectors.ind.ramp[5]],
            ['Mining', p.m, WD.sectors.ind.ramp[3]],
            ['Irrigation', p.ir, WD.sectors.agr.ramp[5]],
            ['Livestock', p.li, WD.sectors.agr.ramp[3]],
            ['Aquaculture', p.aq, WD.sectors.agr.ramp[2]],
            ['Power plants', p.t, WD.sectors.pwr.ramp[5]]
        ];
    }
    function wdPopup(p, key) {
        const S = WD.sectors[key], rows = wdRows(p), max = Math.max(1e-9, ...rows.map(r => r[1] || 0));
        const pcd = p.d != null && p.p ? p.d * 1e6 / (p.p * 1000) : null;   // gallons per person per day
        const bars = rows.map(([t, v, c]) => `<div style="display:grid;grid-template-columns:84px 1fr 62px;align-items:center;gap:6px;font-size:11.5px;margin:2px 0">
            <span>${t}</span><span style="background:#f1f5f9;border-radius:3px;height:9px;overflow:hidden"><i style="display:block;height:100%;width:${((v || 0) / max * 100).toFixed(1)}%;background:${c}"></i></span>
            <b style="text-align:right;font-weight:600">${wdFmt(v)}</b></div>`).join('');
        return `<div class="utility-header" style="color:${S.ramp[5]}">County water use · 2015</div>
            <div class="site-name">${gcEsc(p.cn || p.n || 'County')}${p.s ? ', ' + gcEsc(p.s) : ''}</div>
            <div class="analysis-box">
                <div class="stat-row"><span>${S.long}:</span><strong>${wdFmt(S.v(p))} Mgal/d</strong></div>
                <div class="stat-row"><span>Total withdrawals in county:</span><strong>${wdFmt(p.tot)} Mgal/d</strong></div>
                <div class="stat-row"><span>Population:</span><strong>${p.p != null ? Math.round(p.p * 1000).toLocaleString() : '—'}</strong></div>
                ${pcd != null ? `<div class="stat-row"><span>Domestic use per person:</span><strong>${Math.round(pcd)} gal/day</strong></div>` : ''}
                ${p.ac ? `<div class="stat-row"><span>Irrigated land:</span><strong>${Math.round(p.ac * 1000).toLocaleString()} acres</strong></div>` : ''}
                ${p.ps != null ? `<div class="stat-row"><span>Public-supply withdrawals:</span><strong>${wdFmt(p.ps)} Mgal/d</strong></div>` : ''}
            </div>
            <div style="margin:8px 0 2px;font-size:11px;color:#475569;font-weight:700">Water use by sector (Mgal/d)</div>${bars}
            <p style="font-size:11px;color:#64748b;margin:6px 0 0">${S.note} Million gallons per day, 2015 (latest USGS county estimates for all sectors). Source: USGS, Estimated Use of Water in the United States, County-Level Data for 2015.</p>`;
    }
    function wdMakeLayer(key) {
        const S = WD.sectors[key], grp = L.layerGroup();
        let gj = null;
        grp.on('add', async () => {
            // one sector at a time
            Object.entries(WD.layers).forEach(([k, l]) => { if (k !== key && map.hasLayer(l)) map.removeLayer(l); });
            const n = document.getElementById('lpn-' + key); if (n && !WD.data) n.textContent = 'Loading…';
            let fc; try { fc = await wdLoad(); } catch (e) { if (n) n.textContent = 'Data unavailable'; return; }
            if (n) n.textContent = '';
            if (!map.hasLayer(grp)) return;
            if (!gj) gj = L.geoJSON(fc, {
                renderer: wdRenderer, pane: 'overlayPane',
                style: f => { const c = wdClass(S.v(f.properties)); return { color: '#ffffff', weight: 0.4, opacity: 0.8, fillColor: c < 0 ? '#e2e8f0' : S.ramp[c], fillOpacity: c < 0 ? 0.35 : 0.72 }; },
                onEachFeature: (f, l) => {
                    l.bindTooltip(() => `<b>${gcEsc(f.properties.cn || f.properties.n || '')}${f.properties.s ? ', ' + gcEsc(f.properties.s) : ''}</b><br>${S.t}: ${wdFmt(S.v(f.properties))} Mgal/d`, { sticky: true, direction: 'top', offset: [0, -6] });
                    l.bindPopup(() => wdPopup(f.properties, key), { maxWidth: 330, minWidth: 270 });
                    l.on('mouseover', () => l.setStyle({ weight: 2, color: '#0f172a' })).on('mouseout', () => gj.resetStyle(l))
                     .on('popupopen', () => track('facility_view', { dataset: 'USGS county water use ' + key }));
                }
            });
            grp.addLayer(gj); gj.bringToBack();

    }
    Object.keys(WD.sectors).forEach(k => WD.layers[k] = wdMakeLayer(k));
    // Legend under whichever sector is on
    function wdLegendHtml(key) {
        const S = WD.sectors[key], b = WD.breaks;
        const lab = i => i === 0 ? `Under ${b[0]}` : i === b.length ? `${b[b.length - 1]}+` : `${b[i - 1]}–${b[i]}`;
        return S.ramp.map((c, i) => `<div class="usdm-row"><i style="background:${c};border:1px solid #cbd5e1"></i>${lab(i)} Mgal/d</div>`).join('')
            + `<div class="usdm-row"><i style="background:#e2e8f0;opacity:.6"></i>No estimate</div>`
            + `<div class="usdm-note">${S.note} Water use by county, million gallons per day · USGS 2015 · click a county for all sectors</div>`;
    }

    // Report section 7: water demand by sector (USGS 2015 county estimates)
    const WD_SECT = [['d', 'Domestic'], ['i', 'Industrial'], ['m', 'Mining'], ['ir', 'Irrigation'], ['li', 'Livestock'], ['aq', 'Aquaculture'], ['t', 'Power plants']];
    const WD_COLOR = { d: '#1d4ed8', i: '#7e22ce', m: '#c084fc', ir: '#4d7c0f', li: '#84cc16', aq: '#bef264', t: '#c2410c' };
    function wdCountyBoxes(fc) { if (!fc._bb) fc.features.forEach(f => f._bb = turf.bbox(f)); fc._bb = true; }
    function wdCountyAt(lat, lng) {
        const fc = WD.data; wdCountyBoxes(fc);
        return fc.features.find(f => lng >= f._bb[0] && lng <= f._bb[2] && lat >= f._bb[1] && lat <= f._bb[3] && inPoly(f, lat, lng)) || null;
    }
    // Counties overlapping an area, each with the share of its land inside the area
    function wdCountiesIn(area) {
        const fc = WD.data; wdCountyBoxes(fc);
        const ab = turf.bbox(area), out = [];
        fc.features.forEach(f => {
            const b = f._bb; if (b[2] < ab[0] || b[0] > ab[2] || b[3] < ab[1] || b[1] > ab[3]) return;
            let share = null;
            try { const x = turf.intersect(f, area); share = x ? turf.area(x) / turf.area(f) : 0; }
            catch (e) { const c = turf.pointOnFeature(f).geometry.coordinates; share = inPoly(area, c[1], c[0]) ? 1 : 0; }   // fallback: county centroid inside?

    const $ = id => document.getElementById(id);
    function pmSyncSeg() {
        document.querySelectorAll('#pm-dialog .pm-seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', pm[seg.dataset.k] === b.dataset.v)));
        $('pm-src-search').style.display = searchMarker && map.hasLayer(searchMarker) ? '' : 'none';
        const p = pmResolvePoint();

    }
    function pmResolvePoint() {
        if (pm.pointSrc === 'search' && searchMarker && map.hasLayer(searchMarker)) return searchMarker.getLatLng();
        if (pm.pointSrc === 'pick' && pm.point) return pm.point;
        return map.getCenter();
    }
    document.querySelectorAll('#pm-dialog .pm-seg').forEach(seg => seg.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        pm[seg.dataset.k] = b.dataset.v;
        if (seg.dataset.k === 'pointSrc' && b.dataset.v === 'pick') { pmStartPick(); return; }
        pmSyncSeg();
    }));
    function pmOpenDialog() { map.closePopup(); pmSyncSeg(); $('pm-dialog').classList.add('open'); $('pm-title').focus(); }
    function pmCloseDialog() { $('pm-dialog').classList.remove('open'); }
    $('pm-cancel').addEventListener('click', () => { pmCloseDialog(); if (document.body.classList.contains('print-mode') && !pm.view) pmExit(); });
    $('pm-dialog').addEventListener('click', e => { if (e.target.id === 'pm-dialog') pmCloseDialog(); });

    function pmStartPick() {
        pmCloseDialog();
        document.body.classList.add('pm-picking');
        const done = latlng => {
            document.body.classList.remove('pm-picking');
            document.removeEventListener('keydown', esc);
            if (latlng) { pm.point = latlng; pm.pointSrc = 'pick'; } else if (!pm.point) pm.pointSrc = 'center';
            pmOpenDialog();
        };
        const onClick = e => done(e.latlng);
        const esc = e => { if (e.key === 'Escape') { map.off('click', onClick); done(null); } };
        map.once('click', onClick);
        document.addEventListener('keydown', esc);
    }

    // Representative fraction at map centre for the printed (100%) size
    function pmScaleText() {
        const c = map.getCenter(), z = map.getZoom();
        const mPerPx = 156543.03392 * Math.cos(c.lat * Math.PI / 180) / Math.pow(2, z);
        const rf = mPerPx / (0.0254 / 96);
        const nice = rf > 10000 ? Math.round(rf / 1000) * 1000 : Math.round(rf / 100) * 100;
        const ftPerIn = mPerPx * 96 * 3.28084;
        const inTxt = ftPerIn >= 5280 ? `${(ftPerIn / 5280).toFixed(2)} mi` : `${Math.round(ftPerIn).toLocaleString()} ft`;
        return { rf: `1:${nice.toLocaleString()}`, inch: `1 in = ${inTxt}` };
    }
    function pmFmtLL(ll) {
        const f = (v, p, n) => `${Math.abs(v).toFixed(4)}°${v >= 0 ? p : n}`;
        return `${f(ll.lat, 'N', 'S')}, ${f(ll.lng, 'E', 'W')}`;
    }
    const pmEsc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function pmBuildTitleBlock() {
        const now = new Date();

        const active = [];
        LAYER_GROUPS.forEach(g => g.items.forEach(it => { if (it.layer && map.hasLayer(it.layer)) active.push(it); }));

        const legend = active.map(it => `<div class="tb-leg">${it.sw}<span>${it.lg || it.label}${it.tag ? ` <em>(${it.tag})</em>` : ''}${it.id === 'proj' ? ` <em>— ${sg} growth, ${sm}% gravity</em>` : ''}</span></div>`).join('')
            + `<div class="tb-leg"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="#e11d48" stroke-width="2"/><path d="M8 1v4M8 11v4M1 8h4M11 8h4" stroke="#e11d48" stroke-width="2"/></svg><span>Location of interest</span></div>`;
        const notes = $('pm-notes').value.trim();
        const withAnalysis = $('pm-analysis').checked;

        const secBrand = `<div class="tb-brand"><div class="b1">BlueCredit</div><div class="b2">${pmEsc($('pm-title').value) || 'Water Map'}</div>${$('pm-sub').value.trim() ? `<div class="b3">${pmEsc($('pm-sub').value)}</div>` : ''}</div>`;
        const secLoc = `<div class="tb-sec"><div class="tb-h">Location of Interest</div>
            <div class="tb-kv"><span>Coordinates</span><b>${pmFmtLL(pt)}</b></div>
            ${withAnalysis ? im3WaterBox('print', true) : ''}</div>`;
        const secMap = `<div class="tb-sec"><div class="tb-h">Map Information</div>
            <div class="tb-kv"><span>Scale (at 100%)</span><b>${sc.rf}</b></div>
            <div class="tb-kv"><span></span><b>${sc.inch}</b></div>
            <div class="tb-kv"><span>Extent N / S</span><b>${b.getNorth().toFixed(4)}° / ${b.getSouth().toFixed(4)}°</b></div>
            <div class="tb-kv"><span>Extent W / E</span><b>${b.getWest().toFixed(4)}° / ${b.getEast().toFixed(4)}°</b></div>
            <div class="tb-kv"><span>Datum</span><b>WGS 84 (Web Mercator)</b></div>
            <div class="tb-kv"><span>Printed</span><b>${now.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}</b></div>
            <div class="tb-kv"><span>Map ID</span><b>${mapId}</b></div></div>`;
        const secLeg = `<div class="tb-sec"><div class="tb-h">Legend</div>${legend}</div>`;
        const secNotes = notes ? `<div class="tb-sec"><div class="tb-h">Notes</div><div class="tb-notes">${pmEsc(notes)}</div></div>` : '';
        const secSrc = `<div class="tb-sec tb-grow"><div class="tb-h">Sources</div><div class="tb-src">
            Data centers: Mongird et al. (2026), IM3 Open Source Data Center Atlas v2026.02.09, doi:10.57931/3017294 (© OpenStreetMap contributors, ODbL); Mongird et al. (2026), IM3 Projected US Data Center Locations v1.1, doi:10.57931/3020186 (CC BY 4.0).
            FOIA water use and replenishment: public-records (FOIA) responses and utility data. Water demand by sector: USGS county water use, 2015.
            Watersheds &amp; rivers: USGS WBD, NHD. Wetlands: USFWS NWI. Utility areas: U.S. EPA. Recycled water: Loudoun Water GIS. Wastewater plants: U.S. EPA CWNS 2022; sewersheds: EPA National Sewershed Dataset; dams: USACE National Inventory of Dams. Flood zones, flood risk and flood insurance claims: FEMA (NFHL, National Risk Index, OpenFEMA). Industrial facilities: EPA TRI 2024. Power plant cooling water: EIA 2024. Universities: HIFLD/NCES. Hospitality: Lodging Econometrics. Facility water estimates: ENERGY STAR/EPA WaterSense benchmarks. Drought: U.S. Drought Monitor (NDMC, USDA, NOAA). Streamflow vs. normal: NOAA National Water Model. Streamgages and groundwater: USGS. Basemap © Google (satellite) or Esri World Street Map (street). Map: Leaflet, Esri Leaflet.</div></div>`;
        const secDisc = `<div class="tb-sec"><div class="tb-disc">For informational and planning-level use only. Not a survey or legal boundary determination. Locations and distances are approximate (straight-line, from facility centroids). Projected data centers are model outputs, not announced facilities. Verify with primary sources before relying on this map.</div></div>`;

        const secLogo = `<div class="tb-sec tb-logo"><img src="${typeof DCWL_LOGO !== 'undefined' ? DCWL_LOGO : 'logo.png'}" alt="BlueCredit"></div>`;   // bottom-right corner of the sheet
        $('pm-tb').innerHTML = pm.orient === 'land'

    function pmFit() {
        const sheet = $('print-sheet');
        const [w, h] = PM_SHEETS[pm.size][pm.orient];
        sheet.style.width = w + 'in'; sheet.style.height = h + 'in';
        sheet.className = pm.orient;
        const pxW = w * 96, pxH = h * 96;
        const s = Math.min((window.innerWidth - 32) / pxW, (window.innerHeight - 90) / pxH, 1);
        sheet.style.transform = s < 1 ? `scale(${s})` : '';
        sheet.style.marginBottom = s < 1 ? `${-(pxH * (1 - s)) + 40}px` : '';
        let pg = $('pm-page'); if (!pg) { pg = document.createElement('style'); pg.id = 'pm-page'; document.head.appendChild(pg); }
        pg.textContent = `@page { size: ${PM_SHEETS[pm.size].page} ${pm.orient === 'land' ? 'landscape' : 'portrait'}; margin: 0.3in; }`;
    }

    function pmWaitTiles(cb) {
        $('pm-status').textContent = 'Loading map…'; $('pm-print').style.opacity = .5;
        let fired = false;
        const finish = () => { if (fired) return; fired = true; $('pm-status').textContent = 'Ready to print'; $('pm-print').style.opacity = 1; cb && cb(); };
        activeBase().once('load', () => setTimeout(finish, 700));
        setTimeout(finish, 5000);
    }

    function pmRender() {
        const center = pm.view ? pm.view.center : map.getCenter(), zoom = pm.view ? pm.view.zoom : map.getZoom();
        pmFit();
        map.invalidateSize({ pan: false });
        map.setView(center, zoom, { animate: false });
        pmPlaceOverlays();
        pmBuildTitleBlock();
        pmWaitTiles();
    }

    $('pm-make').addEventListener('click', () => {
        pm.pointLL = pmResolvePoint();
        track('print_map_create', { page_size: pm.size, orientation: pm.orient === 'land' ? 'landscape' : 'portrait', point_source: pm.pointSrc, map_zoom: map.getZoom() });

        if (!document.body.classList.contains('print-mode')) {
            pm.home = { parent: $('map').parentNode, next: $('map').nextSibling };
            pm.view = { center: map.getCenter(), zoom: map.getZoom() };

            $('pm-mapslot').appendChild($('map'));

            $('pm-op').value = Math.round(IMAGERY_OPACITY.print * 100); $('pm-op-val').textContent = $('pm-op').value + '%';

            pm.view = { center: map.getCenter(), zoom: map.getZoom() };

        pmRender();
        pm.startView = { center: map.getCenter(), zoom: map.getZoom() };   // what "Re-center" returns to
    });

    function pmExit() {
        if (!document.body.classList.contains('print-mode')) return;
        activeBase().setOpacity(IMAGERY_OPACITY.screen);
        const view = { center: map.getCenter(), zoom: map.getZoom() };
        document.body.classList.remove('print-mode');
        pm.home.parent.insertBefore($('map'), pm.home.next);
        if (pm.marker) { map.removeLayer(pm.marker); pm.marker = null; }
        if (pm.scale) pm.scale.remove();
        map.invalidateSize({ pan: false });
        map.setView(view.center, view.zoom, { animate: false });
        pm.view = null;
    }
    $('pm-close').addEventListener('click', pmExit);
    $('pm-op').addEventListener('input', e => {

                ${kpi('Plants that reuse water', t.reuseN + (t.n ? ` of ${t.n}` : ''), t.cap ? `≈ ${t.reuseShare.toFixed(0)}% of capacity (${mgd(t.reuseMgd)}) reused` : '', t.reuseN ? 'pos' : '')}

            <p class="note">Capacity = CWNS existing total design flow; 2042 = projected design flow. "Reused" = share of treated effluent the plant reports sending to reuse (irrigation, industrial, non-potable, potable, etc.); area reuse share is capacity-weighted, so it is an estimate. *Listed as a reclaimed water provider by DOE FEMP (2009–2012) but no reuse reported to CWNS. Plants are assigned by location (point-in-polygon).</p>`;
    }
    function wwSiteSection(d) {

    function brQueryWhere(url, where) {
        return new Promise(resolve => L.esri.query({ url }).where(where).run((err, fc) => resolve(!err && fc && fc.features && fc.features[0] ? fc.features[0] : null)));
    }
    function brQueryIntersects(feature, url) {
        let geom = feature.geometry;
        try { geom = turf.simplify(feature, { tolerance: 0.003, highQuality: false }).geometry; } catch (e) {}
        return new Promise(res => L.esri.query({ url }).intersects(geom).precision(5).limit(500)
            .run((err, r) => res(err ? { error: err, features: [] } : (r || { features: [] }))));
    }
