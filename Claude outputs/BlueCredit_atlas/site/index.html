    // ── shared: collect everything inside a polygon (basin or utility area) ──
    function brCollect(poly) {
        const d = { areaSqMi: turf.area(poly) / 2589988.11, created: new Date() };
        d.foia = Object.values(window.globalDCMap || {}).filter(x => inPoly(poly, x.lat, x.lng));
        const projs = Object.values(window.globalProjMap || {}).filter(x => inPoly(poly, x.lat, x.lng));
        d.repl = projs.filter(x => x.kind !== 'recycled');
        d.recy = projs.filter(x => x.kind === 'recycled');
        d.loudoun = inPoly(poly, LOUDOUN_AGG.lat, LOUDOUN_AGG.lng);
        const years = new Set(), byYr = {};
        const add = (key, yr, v) => { if (!/^\d{4}$/.test(yr)) return; years.add(yr); byYr[yr] = byYr[yr] || { foia: 0, loudoun: 0, repl: 0, recy: 0, reclaimed: 0 }; byYr[yr][key] += v; };
        d.foia.forEach(x => Object.entries(x.yearly).forEach(([y, v]) => add('foia', y, v)));
        d.repl.forEach(x => Object.entries(x.yearly).forEach(([y, v]) => add('repl', y, v)));
        d.recy.forEach(x => Object.entries(x.yearly).forEach(([y, v]) => add('recy', y, v)));
        if (d.loudoun) {
            Object.entries(LOUDOUN_AGG.potable).forEach(([y, v]) => add('loudoun', y, v));
            Object.entries(LOUDOUN_AGG.reclaimed).forEach(([y, v]) => add('reclaimed', y, v));
        }
        d.years = [...years].sort(); d.byYr = byYr;
        d.years.forEach(y => { const r = byYr[y]; r.use = r.foia + r.loudoun; r.benefit = r.repl + r.recy + r.reclaimed; r.net = r.benefit - r.use; });
        d.tot = d.years.reduce((t, y) => { const r = byYr[y]; ['foia','loudoun','repl','recy','reclaimed','use','benefit','net'].forEach(k => t[k] = (t[k] || 0) + r[k]); return t; }, {});
        d.atlas = [];
        (window.im3AtlasFeatures || []).forEach(f => { const q = f.properties; if (inPoly(poly, q.lat, q.lon)) d.atlas.push(q); });
        d.atlas.sort((a, b) => (a.op ? 0 : 1) - (b.op ? 0 : 1) || (a.op || '').localeCompare(b.op || '') || (a.nm ? 0 : 1) - (b.nm ? 0 : 1) || (a.nm || '').localeCompare(b.nm || ''));
        const tally = key => { const m = {}; d.atlas.forEach(q => { const k = q[key] || 'Not listed'; m[k] = m[k] || { n: 0, sqft: 0, campus: 0, building: 0, point: 0 }; m[k].n++; m[k].sqft += q.sqft || 0; m[k][q.t]++; }); return Object.entries(m).sort((a, b) => b[1].n - a[1].n); };
        d.byOp = tally('op'); d.byCounty = tally('co');
        d.scen = {}; d.projSites = [];
        if (window.im3Proj) {
            const F = window.im3Proj.fields;
            Object.entries(window.im3Proj.scenarios).forEach(([k, rows]) => {
                const s = { n: 0, mw: 0, dem: 0, cons: 0 };
                rows.forEach(r => { const o = {}; F.forEach((f, i) => o[f] = r[i]);
                    if (inPoly(poly, o.lat, o.lng)) { s.n++; s.mw += o.data_center_it_power_mw; s.dem += o.cooling_water_demand_mgy * 1e6; s.cons += o.cooling_water_consumption_mgy * 1e6; d.projSites.push({ scenario: k, ...o }); } });
                d.scen[k] = s;
            });
        }
        return d;
    }

    function brChart(d) {
        const ys = d.years; if (!ys.length) return '<p class="note">No annual use or benefit records fall inside this area.</p>';
        const W = 700, H = 170, L0 = 58, R0 = 8, T0 = 10, B0 = 24;
        const max = Math.max(1, ...ys.map(y => Math.max(d.byYr[y].use, d.byYr[y].benefit)));
        const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
        const yv = v => T0 + (H - T0 - B0) * (1 - v / top);
        const gw = (W - L0 - R0) / ys.length, bw = Math.min(26, (gw - 10) / 2);
        let g = '';
        for (let i = 0; i <= 4; i++) { const v = top * i / 4, y = yv(v);
            g += `<line x1="${L0}" x2="${W - R0}" y1="${y}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/><text x="${L0 - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#64748b">${brGal(v).replace(' gal', '')}</text>`; }
        const bar = (x, v, c, lbl) => { const y = yv(v), h = Math.max(0, yv(0) - y), r = Math.min(4, h);
            return `<path d="M${x},${yv(0)} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${yv(0)} Z" fill="${c}"><title>${lbl}: ${brGal(v)}</title></path>`; };
        ys.forEach((y, i) => { const cx = L0 + gw * i + gw / 2, r = d.byYr[y];
            g += bar(cx - bw - 1, r.use, BR_COLORS.use, `${y} data center use`) + bar(cx + 1, r.benefit, BR_COLORS.benefit, `${y} benefit`);
            g += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#475569">${y}</text>`; });
        g += `<line x1="${L0}" x2="${W - R0}" y1="${yv(0)}" y2="${yv(0)}" stroke="#94a3b8" stroke-width="1"/>`;
        return `<div class="br-legend"><span><i style="background:${BR_COLORS.use}"></i>Data center water use</span><span><i style="background:${BR_COLORS.benefit}"></i>Replenishment + recycled water benefit</span></div>
            <div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Annual data center water use versus benefit">${g}</svg></div>`;
    }

    // single-series bar chart (site water use by year)
    // Monthly reported use: line with points; gaps where a month has no record
    function brMonthlyChart(monthly) {
        const ks = Object.keys(monthly || {}).filter(k => /^\d{4}-\d{2}$/.test(k)).sort();
        if (ks.length < 2) return '';
        const idx = k => +k.slice(0, 4) * 12 + (+k.slice(5, 7) - 1);
        const i0 = idx(ks[0]), n = idx(ks[ks.length - 1]) - i0 + 1;
        const W = 700, H = 170, L0 = 58, R0 = 10, T0 = 12, B0 = 26;
        const max = Math.max(1, ...ks.map(k => monthly[k]));
        const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
        const xv = i => L0 + (n === 1 ? 0 : (W - L0 - R0) * i / (n - 1)), yv = v => T0 + (H - T0 - B0) * (1 - v / top);
        let g = '';
        for (let i = 0; i <= 4; i++) { const v = top * i / 4, y = yv(v);
            g += `<line x1="${L0}" x2="${W - R0}" y1="${y}" y2="${y}" stroke="#e5e7eb"/><text x="${L0 - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#64748b">${brGal(v).replace(' gal', '')}</text>`; }
        for (let i = 0; i < n; i++) { const a = i0 + i, mo = a % 12, yr = Math.floor(a / 12);
            if (mo === 0 || i === 0) { const x = xv(i); g += `<line x1="${x}" x2="${x}" y1="${T0}" y2="${H - B0}" stroke="#f1f5f9"/><text x="${x}" y="${H - 9}" text-anchor="${i === 0 ? 'start' : 'middle'}" font-size="9" fill="#475569">${mo === 0 ? yr : ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo] + ' ' + yr}</text>`; } }
        let path = '', pen = false;
        for (let i = 0; i < n; i++) { const a = i0 + i, k = Math.floor(a / 12) + '-' + String(a % 12 + 1).padStart(2, '0');
            if (monthly[k] == null) { pen = false; continue; }
            path += (pen ? 'L' : 'M') + xv(i).toFixed(1) + ',' + yv(monthly[k]).toFixed(1) + ' '; pen = true; }
        g += `<path d="${path}" fill="none" stroke="${BR_COLORS.use}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        ks.forEach(k => { const i = idx(k) - i0; g += `<circle cx="${xv(i).toFixed(1)}" cy="${yv(monthly[k]).toFixed(1)}" r="${n > 48 ? 1.8 : 2.6}" fill="#fff" stroke="${BR_COLORS.use}" stroke-width="1.5"><title>${k}: ${brGal(monthly[k])}</title></circle>`; });
        const peak = ks.reduce((a, k) => monthly[k] > monthly[a] ? k : a, ks[0]);
        return `<div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly reported water use">${g}</svg></div>
            <p class="note">${ks.length} monthly records, ${ks[0]} to ${ks[ks.length - 1]}. Peak month: ${peak} (${brGal(monthly[peak])}). Gaps in the line are months with no record.</p>`;
    }
    function brSiteChart(yearly) {
        const ys = Object.keys(yearly || {}).filter(y => /^\d{4}$/.test(y)).sort();
        if (!ys.length) return '';
        const W = 700, H = 150, L0 = 58, R0 = 8, T0 = 10, B0 = 24;
        const max = Math.max(1, ...ys.map(y => yearly[y]));
        const step = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / step) * step;
        const yv = v => T0 + (H - T0 - B0) * (1 - v / top);
        const gw = (W - L0 - R0) / ys.length, bw = Math.min(40, gw - 12);
        let g = '';
        for (let i = 0; i <= 4; i++) { const v = top * i / 4, y = yv(v);
            g += `<line x1="${L0}" x2="${W - R0}" y1="${y}" y2="${y}" stroke="#e5e7eb"/><text x="${L0 - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="#64748b">${brGal(v).replace(' gal', '')}</text>`; }
        ys.forEach((y, i) => { const x = L0 + gw * i + (gw - bw) / 2, v = yearly[y], yt = yv(v), r = Math.min(4, yv(0) - yt);
            g += `<path d="M${x},${yv(0)} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${yv(0)} Z" fill="${BR_COLORS.use}"><title>${y}: ${brGal(v)}</title></path>`;
            g += `<text x="${x + bw / 2}" y="${yt - 4}" text-anchor="middle" font-size="9" fill="#334155">${brGal(v).replace(' gal', '')}</text>`;
            g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="9" fill="#475569">${y}</text>`; });
        g += `<line x1="${L0}" x2="${W - R0}" y1="${yv(0)}" y2="${yv(0)}" stroke="#94a3b8"/>`;
        return `<div class="br-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Reported annual water use">${g}</svg></div>`;
    }

    function brHead(kicker, title, sub) {

    const kpi = (l, v, n, cls) => `<div class="br-kpi"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div><div class="n">${n}</div></div>`;
    // Report map legend: built from the point layers actually drawn on the report map (brMapPts), plus the boundary
    const MAP_LEGEND = boundary => { br.mapBoundary = boundary; return '<div class="br-maplegend" id="br-maplegend"></div>'; };
    const BR_PTS = [
        { k: 'foia',   c: '#ff1a1a', t: 'FOIA data centers' },

    function brMapLegend() {
        const el = $('br-maplegend'); if (!el) return;
        const keys = br.mapKeys || new Set();
        el.innerHTML = BR_PTS.filter(o => keys.has(o.k)).map(o => {
            const bg = o.c || `conic-gradient(${NID.hz.High} 0 33%, ${NID.hz.Significant} 0 66%, ${NID.hz.Low} 0)`;
            return `<span><i style="background:${bg};${o.ring ? `box-shadow:0 0 0 2px ${o.ring};` : ''}"></i>${o.t}</span>`; }).join('')
            + `<span><i style="background:none;border:2px solid #0f172a;box-shadow:none;border-radius:2px"></i>${brEsc(br.mapBoundary || '')}</span>`;
    }
    // Draw points on the report map; only points inside the map view are drawn and listed in the legend.
    // pts: [{ lat, lng, fill? }]
    function brMapPts(key, pts) {
        const m = br.map, o = BR_PTS.find(x => x.k === key); if (!m || !o || !pts) return 0;
        const b = br.mapView || m.getBounds();
        let n = 0;
        pts.forEach(p => { if (p == null || p.lat == null || p.lng == null || !b.contains([p.lat, p.lng])) return;
            L.circleMarker([p.lat, p.lng], { renderer: o.ctx ? br.ctxRenderer : br.mapRenderer, radius: o.r || 4, color: o.ring || '#fff', weight: o.ring ? 2 : o.ctx ? 0.8 : 1,
                fillColor: p.fill || o.c, fillOpacity: o.ctx ? 0.85 : 1, interactive: false }).addTo(m); n++; });
        if (n) { (br.mapKeys = br.mapKeys || new Set()).add(key); brMapLegend(); }
        return n;
    }
    // After the report sections load: add industry, power, dams, streamgage, well, universities and hospitality to the report map
    async function brMapOverlays(d, kind) {
        if (!br.map) return;
        if (d.ind) { brMapPts('tri', d.ind.tri.map(o => ({ lat: o.lat, lng: o.lon }))); brMapPts('eia', d.ind.eia.map(o => ({ lat: o.lat, lng: o.lon }))); }
        if (d.dams) brMapPts('dam', d.dams.list.map(p => ({ lat: p.lat, lng: p.lng, fill: damColor(p.HAZARD_POTENTIAL) })));
        brMapPts('sg', [d.sg && d.sg.s, d.sgl && d.sgl.s].filter(Boolean).map(x => ({ lat: x.lat, lng: x.lng })));
        if (d.gw && d.gw.w) brMapPts('gw', [{ lat: d.gw.w.lat, lng: d.gw.w.lng }]);
        for (const k of ['uni', 'htl']) {
            try { await facLoad(k); } catch (e) { continue; }
            const F = FAC[k].data, b = br.mapView || br.map.getBounds(), pts = [];
            for (const r of F.rows) { const lat = r[0], lng = r[1];
                if (!b.contains([lat, lng])) continue;
                if (kind !== 'site' && br.feature && !inPoly(br.feature, lat, lng)) continue;
                pts.push({ lat, lng }); if (pts.length >= (kind === 'site' ? 1000 : 250)) break; }   // rows are sorted largest first
            brMapPts(k, pts);
        }
    }

    function brMap(opts) {
        if (br.map) { br.map.remove(); br.map = null; }
        const m = L.map('br-map', { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
        if (opts.bounds) m.fitBounds(opts.bounds, { padding: [12, 12] }); else m.setView(opts.center, opts.zoom);   // view before vectors
        const bm = BASEMAPS[window.activeBasemap] || BASEMAPS.satellite;   // same basemap the viewer picked
        L.tileLayer(bm.url, { maxZoom: bm.maxZoom, opacity: window.activeBasemap === 'street' ? 0.75 : 0.45 }).addTo(m);
        (opts.outlines || []).forEach(o => L.geoJSON(o.feature, { style: o.style }).addTo(m));
        (opts.footprints || []).forEach(f => L.geoJSON(f, { style: { color: '#0f766e', weight: 1.5, fillColor: '#14b8a6', fillOpacity: 0.45 } }).addTo(m));
        br.map = m; br.mapKeys = new Set(); br.mapRenderer = L.svg({ padding: 0.1 });
        m.createPane('brCtx').style.zIndex = 390;                 // context layers (industry, dams, hotels…) sit under data centers and projects
        br.ctxRenderer = L.svg({ pane: 'brCtx', padding: 0.1 });
        br.mapView = (opts.view || (opts.bounds ? L.latLngBounds(opts.bounds) : m.getBounds())).pad(0.02);
        brMapPts('atlas', (opts.atlas || []).map(q => ({ lat: q.lat, lng: q.lon })));
        brMapPts('proj', opts.proj || []);
        brMapPts('foia', opts.foia || []);
        brMapPts('repl', opts.repl || []);
        brMapPts('plants', (opts.plants || []).filter(o => !(o.reuse || o.femp_uses)).map(o => ({ lat: o.lat, lng: o.lon })));
        brMapPts('reuse', (opts.plants || []).filter(o => o.reuse || o.femp_uses).map(o => ({ lat: o.lat, lng: o.lon })));
        brMapPts('recy', opts.recy || []);
        brMapLegend();
        if (opts.target) L.marker(opts.target, { interactive: false, icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13],
            html: `<svg viewBox="0 0 26 26" width="26" height="26"><circle cx="13" cy="13" r="7" fill="none" stroke="#fff" stroke-width="4"/><circle cx="13" cy="13" r="7" fill="none" stroke="#e11d48" stroke-width="2.2"/><path d="M13 1v7M13 18v7M1 13h7M18 13h7" stroke="#fff" stroke-width="4"/><path d="M13 1v7M13 18v7M1 13h7M18 13h7" stroke="#e11d48" stroke-width="2"/></svg>` }) }).addTo(m);
        L.control.scale({ position: 'bottomleft', maxWidth: 120 }).addTo(m);
        const home = mm => opts.bounds ? mm.fitBounds(opts.bounds, { padding: [12, 12] }) : mm.setView(opts.center, opts.zoom);
        new ZoomRecenter({ home }).addTo(m);
        br.map = m;
    }

    async function brWaterBodies(d) {
        const targets = [];
        d.foia.slice(0, 6).forEach(x => targets.push({ key: 'brf' + x.lat + x.lng, label: x.name, op: x.co, kind: 'FOIA', lat: x.lat, lng: x.lng }));
        d.atlas.filter(q => q.sqft).sort((a, b) => b.sqft - a.sqft).slice(0, 10 - targets.length)
            .forEach(q => targets.push({ key: q.t + q.id, label: q.nm || 'Unnamed', op: q.op, kind: 'IM3 ' + q.t, lat: q.lat, lng: q.lon, sqft: q.sqft }));
        const el = $('br-wb');
        if (!targets.length) { el.innerHTML = '<p class="note">No facilities to analyze.</p>'; d.waterBodies = []; return; }
        const timeout = ms => new Promise(r => setTimeout(() => r(null), ms));
        for (let i = 0; i < targets.length; i += 2) {
            brStatus(`Analyzing nearby water bodies ${Math.min(i + 2, targets.length)}/${targets.length}…`);
            await Promise.all(targets.slice(i, i + 2).map(t => Promise.race([im3Analyze(t.key, t.lat, t.lng, true), timeout(15000)])));
        }
        const cell = (t, k) => (im3Cache[t.key] && im3Cache[t.key][k]) || '<span class="br-muted">—</span>';
        d.waterBodies = targets.map(t => ({ ...t, wet: cell(t, 'wet'), riv: cell(t, 'riv'), str: cell(t, 'str'), lak: cell(t, 'lak'), pws: cell(t, 'pws') }));
        el.innerHTML = `<table class="br-t"><thead><tr><th>Facility</th><th>Utility</th><th>Nearest wetland</th><th>Nearest named river</th><th>Nearest stream</th><th>Nearest lake/reservoir</th></tr></thead>
            <tbody>${d.waterBodies.map(t => `<tr><td><b>${brEsc(t.label)}</b><br><span class="br-muted">${brEsc(t.op || '')} · ${t.kind}${t.sqft ? ' · ' + brN(t.sqft) + ' sq ft' : ''}</span></td><td>${t.pws}</td><td>${t.wet}</td><td>${t.riv}</td><td>${t.str}</td><td>${t.lak}</td></tr>`).join('')}</tbody></table>
            <p class="note">All FOIA sites (up to 6) plus the largest IM3 facilities by footprint. Search radius 1 mi for wetlands, 2 mi for rivers and lakes; straight-line from facility centroid.</p>`;
    }

    async function brOverlapUtilities(d) {
        const fc = await brQueryIntersects(br.feature, SVC.pws);
        const el = $('br-overlap');
        if (fc.error) { el.innerHTML = '<p class="note">EPA service-area lookup unavailable right now.</p>'; d.overlaps = []; return; }
        const m50 = d.projSites.filter(s => s.scenario === 'moderate_50');
        d.overlaps = fc.features.map(f => { const pr = f.properties;
            const u = { name: fld(pr, 'NAME') || fld(pr, 'PWS_Name') || 'Unnamed system', id: fld(pr, 'PWSID') || '', pop: parseInt(fld(pr, 'Population_Served_Count')) || 0, atlas: 0, proj: 0 };
            d.atlas.forEach(q => { if (inPoly(f, q.lat, q.lon)) u.atlas++; });
            m50.forEach(s => { if (inPoly(f, s.lat, s.lng)) u.proj++; });
            return u; }).sort((a, b) => b.atlas - a.atlas || b.pop - a.pop);
        const shown = d.overlaps.slice(0, 25);
        el.innerHTML = d.overlaps.length ? `<table class="br-t"><thead><tr><th>Water system</th><th>PWSID</th><th class="num">Population served</th><th class="num">IM3 facilities in area</th><th class="num">Projected sites (mod., 50%)</th></tr></thead>
            <tbody>${shown.map(u => `<tr><td>${brEsc(u.name)}</td><td>${brEsc(u.id)}</td><td class="num">${u.pop ? brN(u.pop) : '—'}</td><td class="num">${u.atlas}</td><td class="num">${u.proj}</td></tr>`).join('')}</tbody></table>
            ${d.overlaps.length > shown.length ? `<p class="note">Showing 25 of ${d.overlaps.length} systems that intersect the ${AREA_WORD(d.kind)} (all are in the CSV). Sorted by data center count, then population.</p>` : ''}`
            : `<p class="note">No mapped public water system service areas intersect this ${AREA_WORD(d.kind)}.</p>`;
    }

    async function brOverlapWatersheds(d) {
        const fc = await brQueryIntersects(br.feature, SVC.huc8);
        const el = $('br-overlap');
        if (fc.error) { el.innerHTML = '<p class="note">Watershed lookup unavailable right now.</p>'; d.overlaps = []; return; }
        const m50 = d.projSites.filter(s => s.scenario === 'moderate_50');
        d.overlaps = fc.features.map(f => { const pr = f.properties;
            const w = { name: fld(pr, 'name') || 'Unnamed basin', id: fld(pr, 'huc8') || '', states: fld(pr, 'states') || '', atlas: 0, foia: 0, proj: 0 };
            d.atlas.forEach(q => { if (inPoly(f, q.lat, q.lon)) w.atlas++; });
            d.foia.forEach(x => { if (inPoly(f, x.lat, x.lng)) w.foia++; });
            m50.forEach(s => { if (inPoly(f, s.lat, s.lng)) w.proj++; });
            return w; }).sort((a, b) => b.atlas - a.atlas);

    }

    // ── toolbar ──
    const trackParams = () => br.kind === 'site' ? { report_type: 'site', operator: br.data && br.data.s.op || 'Not listed' }
        : br.kind === 'utility' ? { report_type: 'utility', pwsid: br.data && br.data.id, utility_name: br.data && br.data.name }
        : br.kind === 'custom' ? { report_type: 'drawn_area' }
        : { report_type: 'basin', huc8: br.data && br.data.id, basin_name: br.data && br.data.name };
    $('br-csv').addEventListener('click', () => { track(br.kind + '_report_download', Object.assign({ format: 'csv' }, trackParams())); br.csv && br.csv(); });
    function brClose() {
        if (!document.body.classList.contains('report-mode')) return;
        document.body.classList.remove('report-mode');
        if (br.map) { br.map.remove(); br.map = null; }
    }
    $('br-close').addEventListener('click', brClose);
    $('br-modal').addEventListener('click', e => { if (e.target.id === 'br-modal') brClose(); });   // click the dimmed map to close
    document.addEventListener('keydown', e => { if (e.key === 'Escape') brClose(); });
    $('br-print').addEventListener('click', () => {
        let pg = $('pm-page'); if (!pg) { pg = document.createElement('style'); pg.id = 'pm-page'; document.head.appendChild(pg); }
        pg.textContent = '@page { size: letter portrait; margin: 0.5in; }';
        track(br.kind + '_report_download', Object.assign({ format: 'pdf' }, trackParams()));
        const prevTitle = document.title;
        document.title = br.docTitle;
        if (br.map) br.map.invalidateSize();
        setTimeout(() => { window.print(); document.title = prevTitle; }, 250);
    });


    // ── RIGHT-CLICK MENU (like Google Maps) ─────────────────────────
    // Right-click (or long-press on touch) anywhere on the map: coordinates to copy, then
    // location / watershed / utility reports and print for that exact point.
    const ctx = { el: null, latlng: null, pin: null };
    (function buildCtxMenu() {
        const el = document.createElement('div');
        el.id = 'map-ctx'; el.setAttribute('role', 'menu'); el.hidden = true;
        const I = {
            pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
            doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
            basin: '<path d="M3 17c3-4 5-4 8 0s5 4 8 0"/><path d="M3 11c3-4 5-4 8 0s5 4 8 0"/>',
            tap: '<path d="M12 3v4M8 7h8v3a4 4 0 0 1-8 0z"/><path d="M12 14v2M10.5 19.5a1.5 1.5 0 1 0 3 0c0-1-1.5-2.5-1.5-2.5s-1.5 1.5-1.5 2.5z"/>',
            print: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
            center: '<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
            copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'
        };
        const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
        const lock = '<span class="lp-lock" title="Pro feature">PRO</span>';
        el.innerHTML = `
            <button type="button" class="ctx-coords" data-act="copy" role="menuitem" title="Copy coordinates">${svg('copy')}<span id="ctx-xy"></span></button>
            <div class="ctx-sep"></div>
            <button type="button" data-act="here" role="menuitem">${svg('pin')}<span>What's here?</span></button>
            <button type="button" data-act="site" role="menuitem">${svg('doc')}<span>Location report</span>${lock}</button>
            <button type="button" data-act="basin" role="menuitem">${svg('basin')}<span>Watershed report</span>${lock}</button>
            <button type="button" data-act="utility" role="menuitem">${svg('tap')}<span>Water utility report</span>${lock}</button>
            <button type="button" data-act="print" role="menuitem">${svg('print')}<span>Print map here</span>${lock}</button>
            <div class="ctx-sep"></div>
            <button type="button" data-act="center" role="menuitem">${svg('center')}<span>Center map here</span></button>
            <div class="ctx-msg" id="ctx-msg" hidden></div>`;
        document.body.appendChild(el);
        ctx.el = el;
        L.DomEvent.disableClickPropagation(el);
        L.DomEvent.disableScrollPropagation(el);
        el.addEventListener('contextmenu', e => e.preventDefault());
        el.addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) ctxAction(b.dataset.act, b); });
    })();

    const ctxFmt = ll => `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
    function ctxClose() {
        if (!ctx.el || ctx.el.hidden) return;
        ctx.el.hidden = true;
        ctx.el.querySelectorAll('button').forEach(b => { b.disabled = false; b.classList.remove('busy'); });
    }
    function ctxMsg(t) { const m = $('ctx-msg'); m.textContent = t || ''; m.hidden = !t; }
    function ctxOpen(e) {
        if (document.body.classList.contains('print-mode') || document.body.classList.contains('pm-picking')) return;
        L.DomEvent.preventDefault(e.originalEvent);
        ctx.latlng = e.latlng;
        $('ctx-xy').textContent = ctxFmt(e.latlng);
        ctxMsg('');
        const el = ctx.el; el.hidden = false;
        const W = el.offsetWidth, H = el.offsetHeight;
        const x = Math.min(e.originalEvent.clientX, window.innerWidth - W - 8), y = Math.min(e.originalEvent.clientY, window.innerHeight - H - 8);
        el.style.left = Math.max(8, x) + 'px'; el.style.top = Math.max(8, y) + 'px';
        track('map_context_menu', {});
    }
    map.on('contextmenu', ctxOpen);
    map.on('movestart zoomstart click', ctxClose);
    document.addEventListener('mousedown', e => { if (ctx.el && !ctx.el.hidden && !ctx.el.contains(e.target)) ctxClose(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') ctxClose(); });

    function ctxPin(ll) {
        if (ctx.pin) map.removeLayer(ctx.pin);
        ctx.pin = L.marker(ll, { title: ctxFmt(ll) }).addTo(map);
        return ctx.pin;
    }
    async function ctxLookup(url, ll) {
        const fc = await esriQuery(url, turf.point([ll.lng, ll.lat]));
        if (fc.error) return { error: true };
        const feats = fc.features || [];
        // Overlapping service areas: prefer the one serving the most people
        feats.sort((a, b) => (parseInt(fld(b.properties, 'Population_Served_Count')) || 0) - (parseInt(fld(a.properties, 'Population_Served_Count')) || 0));
        return { feature: feats[0] || null };
    }
    function ctxPlaceRef(ll, name) {
        window._siteRefs = window._siteRefs || {};
        const key = 'p' + ll.lat.toFixed(5) + '_' + ll.lng.toFixed(5);
        window._siteRefs[key] = { kind: 'place', name: name || `Location ${ctxFmt(ll)}`, addr: ctxFmt(ll), lat: ll.lat, lng: ll.lng };
        return key;
    }

    async function ctxAction(act, btn) {
        const ll = ctx.latlng; if (!ll) return;
        track('map_context_action', { action: act });
        if (act === 'copy') {
            const txt = ctxFmt(ll);
            try { await navigator.clipboard.writeText(txt); ctxMsg('Coordinates copied'); }
            catch (e) { ctxMsg(txt); }
            setTimeout(ctxClose, 900);
            return;
        }
        if (act === 'center') { ctxClose(); map.panTo(ll); return; }
        if (act === 'here') {
            ctxClose();
            const key = ctxPlaceRef(ll);
            const id = 'ctx' + Date.now();
            ctxPin(ll).bindPopup(`
                <div class="utility-header">Dropped pin</div>
                <div class="stat-row"><span>Coordinates:</span><strong>${ctxFmt(ll)}</strong></div>
                <div class="stat-row"><span>Watershed:</span><strong id="${id}-huc">Looking up…</strong></div>
                <div class="stat-row"><span>Water utility:</span><strong id="${id}-pws">Looking up…</strong></div>
                ${REPORT_BTN('Download location report', `openSiteReport('${key}')`)}`, { maxWidth: 300 }).openPopup();
            const set = (k, html) => { const e = document.getElementById(`${id}-${k}`); if (e) e.innerHTML = html; };
            ctxLookup(SVC.huc8, ll).then(r => set('huc', r.error ? 'unavailable' : r.feature ? `${brEsc(fld(r.feature.properties, 'name') || '')} <span style="color:#64748b;font-weight:400">(${fld(r.feature.properties, 'huc8')})</span>` : 'Not found'));
            ctxLookup(SVC.pws, ll).then(r => set('pws', r.error ? 'unavailable' : r.feature ? brEsc(fld(r.feature.properties, 'NAME') || fld(r.feature.properties, 'PWS_Name') || 'Unnamed system') : '<span style="color:#b45309">Outside mapped service areas</span>'));
            return;
        }
        const pro = fn => (window.dcwlRequirePro ? window.dcwlRequirePro(fn, act + '_report') : fn());
        if (act === 'site') { ctxClose(); window.openSiteReport(ctxPlaceRef(ll)); return; }
        if (act === 'print') {
            ctxClose();
            pm.point = ll; pm.pointSrc = 'pick';
            $('sb-print').click();
            return;
        }
        if (act === 'basin' || act === 'utility') {
            pro(async () => {
                ctx.el.hidden = false;
                btn.disabled = true; btn.classList.add('busy');
                ctxMsg(act === 'basin' ? 'Finding the watershed…' : 'Finding the water utility…');
                const r = await ctxLookup(act === 'basin' ? SVC.huc8 : SVC.pws, ll);
                btn.disabled = false; btn.classList.remove('busy');
                if (r.error) { ctxMsg('Lookup unavailable right now. Try again.'); return; }
                if (!r.feature) { ctxMsg(act === 'basin' ? 'No watershed found here.' : 'No mapped water utility serves this point.'); return; }
                ctxClose();
                if (act === 'basin') { window._basinFeature = r.feature; window.openBasinReport(); }
                else { window._utilityFeature = r.feature; window.openUtilityReport(); }
            });
        }
    }

    // Load data then trace the EPA service boundary
    loadLoudounAgg().then(() => { loadMapData(); buildLoudounZoneFromEPA(); });
    loadIM3Atlas();
    loadIM3Proj();
</script>
<!-- ── BlueCredit app launcher (Google-style 9-dot menu, top right). Edit BC_APPS to add or change apps. ── -->
<style>
    #bc-apps { position: absolute; top: 22px; right: 24px; z-index: 1003; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    #bc-apps-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); display: grid; place-items: center; cursor: pointer; color: #3c4043; }
    #bc-apps-btn:hover, #bc-apps.open #bc-apps-btn { background: #e8eaed; }
    #bc-apps-btn:focus-visible { outline: 3px solid rgba(30,111,217,.45); outline-offset: 2px; }
    #bc-apps-btn svg { width: 22px; height: 22px; }
    #bc-apps-panel { position: absolute; top: 56px; right: 0; width: 300px; max-width: calc(100vw - 32px); background: #e9eef6; border-radius: 28px; padding: 8px; box-shadow: 0 8px 28px rgba(15,23,42,.28); display: none; }
    #bc-apps.open #bc-apps-panel { display: block; animation: bcAppsIn .14s ease-out; }
    @keyframes bcAppsIn { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
    #bc-apps-panel .card { background: #f8fafd; border-radius: 22px; padding: 16px 12px 12px; }
    #bc-apps-panel .hd { font-size: 19px; font-weight: 500; color: #1f1f1f; padding: 2px 10px 12px; }
    #bc-apps-panel .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    #bc-apps-panel a.app { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border-radius: 16px; text-decoration: none; color: #1f1f1f; font-size: 14px; text-align: center; position: relative; }
    #bc-apps-panel a.app:hover, #bc-apps-panel a.app:focus-visible { background: #e3e8f0; outline: none; }
    #bc-apps-panel a.app.here { background: #dbe7fb; }
    #bc-apps-panel a.app .ic { width: 48px; height: 48px; display: grid; place-items: center; }
    #bc-apps-panel a.app .ic svg { width: 48px; height: 48px; display: block; }
    #bc-apps-panel a.app small { position: absolute; top: 6px; right: 8px; font-size: 9.5px; font-weight: 700; color: #1e6fd9; text-transform: uppercase; letter-spacing: .04em; }
    #bc-apps-panel .ft { text-align: center; font-size: 12.5px; color: #444746; padding: 10px 6px 4px; }
    #bc-apps-panel .ft a { color: #0b57d0; text-decoration: none; font-weight: 600; }
    /* account chip sits to the left of the launcher */
    html body.acct-tr #acct-chip { right: 82px; }
    html body.acct-tr #acct-menu { right: 82px; }
    @media (min-width: 701px) and (max-width: 1260px) { #search-container, body.sb-open #search-container { right: 260px; } }
    @media (max-width: 700px) {
        #bc-apps { position: absolute; top: 16px; right: 16px; }
        #bc-apps-btn { width: 44px; height: 44px; }
        html body.acct-tr #acct-chip { right: 70px; }
        html body.acct-tr #acct-menu { right: 70px; }
    }
    body.print-mode #bc-apps { display: none; }
    @media print { #bc-apps { display: none !important; } }
</style>
<div id="bc-apps">
    <button type="button" id="bc-apps-btn" aria-haspopup="true" aria-expanded="false" aria-controls="bc-apps-panel" title="BlueCredit apps" aria-label="BlueCredit apps">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2.1"/><circle cx="12" cy="5" r="2.1"/><circle cx="19" cy="5" r="2.1"/><circle cx="5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19" cy="12" r="2.1"/><circle cx="5" cy="19" r="2.1"/><circle cx="12" cy="19" r="2.1"/><circle cx="19" cy="19" r="2.1"/></svg>
    </button>
    <div id="bc-apps-panel" role="menu" aria-label="BlueCredit apps"></div>
</div>
<script>
(function () {
    // BlueCredit apps shown in the launcher, in this order (same as the Marketplace/Account launcher).
    // Account and Marketplace URLs follow window.BC_ACCOUNT (js/account.js).
    const acctUrl = () => ((window.BC_ACCOUNT && window.BC_ACCOUNT.account) || 'https://marketplace.bluecredits.org/account').replace(/\/$/, '');
    const initials = () => { const u = window.dcwlUser && window.dcwlUser(); return u ? (((u.first_name || '')[0] || '') + ((u.last_name || '')[0] || '') || (u.email || '?')[0]).toUpperCase() : ''; };
    const BC_APPS = [
        { name: 'Account', url: () => acctUrl(), desc: 'Profile, security, plan and billing',
          icon: () => { const i = initials(); return `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="#0b7dda"/>${i ? `<text x="24" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="${i.length > 1 ? 16 : 20}" font-weight="700" fill="#fff">${i}</text>` : '<path d="M24 24.5a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm0 3c-5.3 0-10 2.7-10 6.2V36h20v-2.3c0-3.5-4.7-6.2-10-6.2z" fill="#fff"/>'}</svg>`; } },
        { name: 'Home', url: () => 'https://bluecredits.org', desc: 'BlueCredit company site',
          icon: () => '<svg viewBox="0 0 48 48"><defs><linearGradient id="bcaH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4da6ff"/><stop offset="1" stop-color="#0047b3"/></linearGradient></defs><path d="M24 5s-13 15.6-13 23.4C11 36 16.8 42 24 42s13-6 13-13.6C37 20.6 24 5 24 5z" fill="url(#bcaH)"/><path d="M24 22l-7 6v8h5v-5h4v5h5v-8z" fill="#fff"/></svg>' },
        { name: 'Marketplace', url: () => acctUrl().replace(/\/account$/, '') + '/marketplace', desc: 'Buy, hold and retire water credits',
          icon: () => '<svg viewBox="0 0 48 48"><defs><linearGradient id="bcaM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><path d="M11 16h26l-2.2 22.2A3 3 0 0 1 31.8 41H16.2a3 3 0 0 1-3-2.8z" fill="url(#bcaM)"/><path d="M18 18v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><path d="M24 23.5s-5 5.6-5 8.8a5 5 0 0 0 10 0c0-3.2-5-8.8-5-8.8z" fill="#fff"/></svg>' },
        { name: 'Atlas', url: () => '/', here: true, desc: 'U.S. water demand, supply and monitoring map',
          icon: () => '<svg viewBox="0 0 48 48"><path d="M6 12l11-4 14 4 11-4v28l-11 4-14-4-11 4z" fill="#dbeafe"/><path d="M17 8v28M31 12v28" stroke="#93c5fd" stroke-width="2"/><path d="M6 12l11-4 14 4 11-4v28l-11 4-14-4-11 4z" fill="none" stroke="#1e6fd9" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 14c-4.4 0-7.5 3.2-7.5 7.3 0 5.5 7.5 13.2 7.5 13.2s7.5-7.7 7.5-13.2C31.5 17.2 28.4 14 24 14z" fill="#1a6fdb"/><circle cx="24" cy="21.3" r="2.8" fill="#fff"/></svg>' }
    ];
    const root = document.getElementById('bc-apps'), btn = document.getElementById('bc-apps-btn'), panel = document.getElementById('bc-apps-panel');
    const draw = () => {
        panel.innerHTML = `<div class="card"><div class="hd">BlueCredit apps</div><div class="grid">${BC_APPS.map(a =>
            `<a class="app${a.here ? ' here' : ''}" role="menuitem" href="${a.url()}"${a.here ? ' aria-current="page"' : ''} title="${a.desc}"><span class="ic">${a.icon()}</span>${a.name}</a>`).join('')}</div></div>
            <div class="ft">One BlueCredit account for every app · <a href="https://bluecredits.org">bluecredits.org</a></div>`;
        panel.querySelectorAll('a.app').forEach(a => a.addEventListener('click', e => {
            if (a.classList.contains('here')) { e.preventDefault(); setOpen(false); return; }   // already in this app
            if (typeof track === 'function') track('app_launcher_click', { app: a.textContent.trim() });
        }));
    };
    const setOpen = open => { if (open) { draw(); const m = document.getElementById('acct-menu'); if (m) m.classList.remove('open'); } root.classList.toggle('open', open); btn.setAttribute('aria-expanded', open); if (open) { const f = panel.querySelector('a.app'); f && f.focus({ preventScroll: true }); if (typeof track === 'function') track('app_launcher_open'); } };
    btn.addEventListener('click', e => { e.stopPropagation(); setOpen(!root.classList.contains('open')); });
    document.addEventListener('click', e => { if (!root.contains(e.target)) setOpen(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && root.classList.contains('open')) { setOpen(false); btn.focus(); } });
    ['mousedown', 'dblclick', 'wheel', 'touchstart', 'contextmenu'].forEach(t => root.addEventListener(t, e => e.stopPropagation()));
})();
</script>
