<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — BlueCredit Atlas</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
        // Old DCWL-style paths (/pages/map.html, /map.html) open the map
        if (/^\/(pages\/)?map\.html$/.test(location.pathname)) location.replace('/' + location.search + location.hash);
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
        .lockup { display: inline-flex; align-items: flex-end; gap: 9px; margin-bottom: 18px; text-decoration: none; }
        .lockup img { width: 160px; height: auto; display: block; }
        .lockup span { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 400; color: #5f6368; line-height: 1; margin-bottom: -3px; }
        h1 { font-size: 1.6rem; margin: 0 0 8px; color: #0f172a; }
        p { color: #64748b; margin: 0 0 22px; }
        a.btn { display: inline-block; background: #1e6fd9; color: #fff; text-decoration: none; font-weight: 700; padding: 11px 22px; border-radius: 999px; }
    </style>
</head>
<body>
    <div>
        <a class="lockup" href="/"><img src="/logo.png" alt="BlueCredit"><span>Atlas</span></a><br>
        <h1>Page not found</h1>
        <p>The page you're looking for isn't here.</p>
        <a class="btn" href="/">Open BlueCredit Atlas</a>
    </div>
</body>
</html>
