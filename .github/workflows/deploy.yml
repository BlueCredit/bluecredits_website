name: Deploy to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: |
            set -e

            echo "==> Pulling latest code"
            cd /opt/bluecredits/website
            git pull origin main

            echo "==> Building Docker image"
            docker build -t bluecredits-website:contabo .

            echo "==> Restarting container"
            docker restart bluecredits_website

            echo "==> Done"
            docker logs bluecredits_website --tail 5
