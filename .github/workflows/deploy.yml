name: Deploy to Contabo

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          script: bash /opt/bluecredits/deploy-website.sh

  smoke-test:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Homepage responds
        run: curl -sf -o /dev/null -w "HTTP %{http_code}" https://bluecredits.org
